    /* === Enhanced Mi Cuaderno de Oposiciones Styles === */
    .pdf-host {
      width: 100%;
      height: 75vh;
      min-height: 580px;
      display: flex;
      flex-direction: column;
      border-radius: 12px;
      overflow: hidden;
      border: 1px solid var(--line);
      background: #474747;
      margin-top: 10px;
    }
    .pdf-host iframe, .pdf-host object {
      width: 100%;
      height: 100%;
      flex: 1;
      border: none;
      background: white;
    }
    .pdf-toolbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 8px 14px;
      background: #faf8f5;
      border-bottom: 1px solid #eae5dc;
      font-size: 12px;
      gap: 10px;
      flex-wrap: wrap;
    }
    .bracket-tree-wrapper {
      padding: 16px;
      background: #faf8f5;
      border-radius: 12px;
      border: 1px solid var(--line);
      font-family: var(--sans);
    }
    .bracket-container {
      display: flex;
      align-items: center;
      margin-top: 10px;
    }
    .bracket-root-node {
      display: flex;
      align-items: center;
      width: 100%;
    }
    .bracket-root-badge {
      background: #6e48aa;
      color: white;
      font-weight: 700;
      padding: 10px 16px;
      border-radius: 10px;
      font-size: 13px;
      box-shadow: 0 4px 10px rgba(110,72,170,0.2);
      max-width: 220px;
      text-align: center;
    }
    .bracket-big-curly {
      font-size: 64px;
      color: #6e48aa;
      font-weight: 200;
      line-height: 1;
      padding: 0 10px;
      user-select: none;
    }
    .bracket-main-branches {
      display: flex;
      flex-direction: column;
      gap: 12px;
      flex: 1;
    }
    .bracket-branch-row {
      display: flex;
      align-items: center;
      background: white;
      border: 1px solid #e5dff4;
      border-radius: 8px;
      padding: 8px 12px;
    }
    .bracket-group-title {
      font-weight: 700;
      color: #3b285a;
      min-width: 150px;
      font-size: 12.5px;
    }
    .bracket-sub-curly {
      font-size: 38px;
      color: #bfa8e8;
      font-weight: 200;
      line-height: 1;
      padding: 0 8px;
      user-select: none;
    }
    .bracket-leaf-list {
      display: flex;
      flex-direction: column;
      gap: 4px;
      flex: 1;
    }
    .bracket-leaf-item {
      font-size: 12px;
      color: #4a3e3d;
      display: flex;
      align-items: baseline;
      gap: 6px;
    }
    .bracket-bullet {
      color: #6e48aa;
      font-weight: bold;
    }
    .cuadro-table {

    t1: `TEMA 1. LA CONSTITUCIÓN ESPAÑOLA DE 1978: ESTRUCTURA Y CONTENIDO. VALORES SUPERIORES Y PRINCIPIOS CONSTITUCIONALES. LA REFORMA DE LA CONSTITUCIÓN.

1. CONTEXTO HISTÓRICO Y GÉNESIS DE LA CE 1978
La Constitución Española de 1978 es la norma cúspide del ordenamiento jurídico español, fruto del consenso de las fuerzas políticas durante la Transición democrática.
Fechas clave de cita obligatoria en examen:
- 31 de octubre de 1978: Aprobación del texto en sesiones separadas del Congreso de los Diputados y del Senado.
- 6 de diciembre de 1978: Ratificación por el pueblo español en referéndum nacional con el 87,7% de votos favorables.
- 27 de diciembre de 1978: Sanción y promulgación solemne por Su Majestad el Rey Juan Carlos I ante las Cortes.
- 29 de diciembre de 1978: Publicación oficial en el BOE (nº 311.1) y entrada en vigor inmediata el mismo día de su publicación (Disposición Final).
Disposición Derogatoria Única: Deroga expresamente la Ley para la Reforma Política de 1977 y todas las Leyes Fundamentales del franquismo, así como cuantas disposiciones se opongan a la Constitución.

2. ESTRUCTURA FORMAL Y MATERIAL DE LA CONSTITUCIÓN
Consta formalmente de un Preámbulo, 169 artículos, Título Preliminar y 10 Títulos numerados, 4 Disposiciones Adicionales, 9 Disposiciones Transitorias, 1 Disposición Derogatoria y 1 Disposición Final.
- El Preámbulo: Redactado por Enrique Tierno Galván. Carece de fuerza jurídica vinculante, pero tiene gran valor hermenéutico e interpretativo.
- Parte Dogmática: Título Preliminar (arts. 1-9) y Título I (arts. 10-55: De los derechos y deberes fundamentales).
- Parte Orgánica: Regula los órganos constitucionales y la división de poderes en los Títulos II al X:
  * Título II: La Corona (arts. 56 a 65).
  * Título III: Las Cortes Generales (arts. 66 a 96).
  * Título IV: El Gobierno y la Administración (arts. 97 a 107).
  * Título V: Relaciones entre el Gobierno y las Cortes Generales (arts. 108 a 116).
  * Título VI: El Poder Judicial (arts. 117 a 127).
  * Título VII: Economía y Hacienda (arts. 128 a 136).
  * Título VIII: De la Organización Territorial del Estado (arts. 137 a 158).
  * Título IX: Del Tribunal Constitucional (arts. 159 a 165).
  * Título X: De la Reforma Constitucional (arts. 166 a 169).

3. VALORES SUPERIORES Y FORMA POLÍTICA (ARTÍCULO 1 CE)
El artículo 1.1 proclama: «España se constituye en un Estado social y democrático de Derecho, que propugna como valores superiores de su ordenamiento jurídico la libertad, la justicia, la igualdad y el pluralismo político».
- Estado de Derecho: Principio de constitucionalidad y legalidad (art. 9.1).
- Estado Social: Compromiso de los poderes públicos de remover los obstáculos para la igualdad real y efectiva (art. 9.2).
- Estado Democrático y Soberanía Nacional: La soberanía nacional reside en el pueblo español, del que emanan los poderes del Estado (art. 1.2).
- Forma política del Estado: Monarquía parlamentaria (art. 1.3). El Rey es el Jefe del Estado pero carece de potestad legislativa o gubernativa propia; todos sus actos requieren refrendo ministerial (art. 64).

4. PRINCIPIOS CONSTITUCIONALES DEL ARTÍCULO 9.3 CE
El art. 9.3 garantiza de forma expresa siete principios nucleares:
1. Principio de legalidad: Primacía de la ley y sometimiento pleno de la Administración a la misma.
2. Jerarquía normativa: Invalidez de las disposiciones reglamentarias que contradigan a las leyes.
3. Publicidad de las normas: Publicación oficial obligatoria en diarios oficiales para producir efectos.
4. Irretroactividad: Prohibición de aplicar retroactivamente normas sancionadoras desfavorables o restrictivas de derechos individuales.
5. Seguridad jurídica: Certeza del derecho y confianza de los ciudadanos en la previsibilidad de los poderes públicos.
6. Responsabilidad de los poderes públicos: Indemnización directa por lesiones patrimoniales derivadas del funcionamiento público.
7. Interdicción de la arbitrariedad de los poderes públicos: Prohibición de resoluciones no motivadas o basadas en el capricho.

5. EL PROCEDIMIENTO DE REFORMA CONSTITUCIONAL (TÍTULO X, ARTS. 166-169)
La Constitución Española se caracteriza por su rigidez constitucional.
A) Iniciativa de reforma (Art. 166):
Corresponde al Gobierno, al Congreso de los Diputados, al Senado y a las Asambleas de las Comunidades Autónomas (art. 87.1 y 87.2).
¡Trampa de examen!: La Iniciativa Legislativa Popular NO cabe para la reforma de la Constitución (art. 87.3 excluye materias de ley orgánica y reforma).
B) Procedimiento Ordinario de Reforma (Art. 167):
Para reformar cualquier parte que no esté sujeta al procedimiento agravado.
- Quórum: Aprobación por mayoría de 3/5 de cada Cámara (Congreso y Senado).
- Si no hay acuerdo: Se nombra una Comisión mixta paritaria (Congreso-Senado) que redacta un texto de consenso que se vota por 3/5 en ambas Cámaras.
- Vía de escape: Si no se aprueba por Comisión mixta, y el texto ha obtenido mayoría absoluta en el Senado, el Congreso puede aprobar la reforma por mayoría de 2/3.
- Referéndum potestativo: Se celebrará si lo solicita una décima parte (1/10) de los miembros de cualquiera de las Cámaras (35 diputados o 26 senadores) dentro de los 15 días siguientes a su aprobación definitiva.
C) Procedimiento Agravado de Reforma (Art. 168):
Exigible preceptivamente si se propone la revisión total de la Constitución o una revisión parcial que afecte a:
1. El Título Preliminar (arts. 1 a 9).
2. La Sección 1ª del Capítulo II del Título I (arts. 15 a 29: Derechos Fundamentales).
3. El Título II (arts. 56 a 65: La Corona).
Trámites preceptivos del procedimiento agravado:
1. Aprobación del principio de reforma por mayoría de dos tercios (2/3) de cada Cámara.
2. Disolución inmediata de las Cortes Generales.
3. Convocatoria de elecciones y nuevas Cámaras que ratifican la decisión y aprueban el nuevo texto por mayoría de dos tercios (2/3).
4. Referéndum de ratificación OBLIGATORIO y PRECEPTIVO para el pueblo español.
D) Límites temporales (Art. 169):
No podrá iniciarse la reforma constitucional en tiempo de guerra o bajo la vigencia de los estados de alarma, excepción y sitio (art. 116).

6. PUNTOS CRÍTICOS Y TRAMPAS FRECUENTES EN EL EXAMEN DE GACE Y C1
- Trampa 1: El Título I completo NO va por el art. 168. Solo la Sección 1ª del Capítulo II (arts. 15 al 29). El art. 14 (igualdad) y la Sección 2ª van por el art. 167 ordinario.
- Trampa 2: El referéndum del art. 167 NO es obligatorio; solo es preceptivo si lo pide el 10% en 15 días. En el art. 168 el referéndum es SIEMPRE preceptivo y obligatorio.
- Trampa 3: Los valores superiores son 4 (libertad, justicia, igualdad, pluralismo político). No confundirlos con los principios del art. 9.3 ni con el art. 103 (eficacia, jerarquía, descentralización, desconcentración, coordinación).
- Trampa 4: No se pueden INICIAR reformas bajo estados del art. 116 (alarma, excepción o sitio). Si ya estaba iniciada, el art. 169 prohíbe iniciarla, debiendo suspenderse la tramitación.`,
    t2: `TEMA 2. LOS DERECHOS Y DEBERES FUNDAMENTALES EN LA CONSTITUCIÓN ESPAÑOLA. EL PRINCIPIO DE IGUALDAD. LOS DERECHOS FUNDAMENTALES Y LAS LIBERTADES PÚBLICAS. LOS DEBERES DE LOS CIUDADANOS. LOS PRINCIPIOS RECTORES. SU GARANTÍA Y SUSPENSIÓN. EL DEFENSOR DEL PUEBLO.

1. ESTRUCTURA Y SISTEMÁTICA DEL TÍTULO I (ARTS. 10 AL 55)
El Título I consta de 46 artículos precedidos por el Art. 10 y divididos en 5 Capítulos:
- Art. 10: Pórtico y pórtico axiológico. 10.1: Dignidad de la persona, derechos inviolables inherentes, libre desarrollo de la personalidad y respeto a la ley y derechos de los demás. 10.2: Cláusula hermenéutica de conformidad con la Declaración Universal de Derechos Humanos y tratados ratificados.
- Capítulo I (Arts. 11-13): De los españoles y los extranjeros. Mayoría de edad a los 18 años (Art. 12). Sufragio en municipales a extranjeros por reciprocidad (Art. 13.2).
- Capítulo II (Arts. 14-38): Derechos y libertades. Art. 14 (Igualdad ante la ley sin discriminación). Sección 1ª (Arts. 15-29: Derechos fundamentales y libertades públicas). Sección 2ª (Arts. 30-38: Derechos y deberes de los ciudadanos).
- Capítulo III (Arts. 39-52): De los principios rectores de la política social y económica.
- Capítulo IV (Arts. 53-54): De las garantías de las libertades y derechos fundamentales.
- Capítulo V (Art. 55): De la suspensión de los derechos y libertades.

2. EL PRINCIPIO DE IGUALDAD (ART. 14 CE)
«Los españoles son iguales ante la ley, sin que pueda prevalecer discriminación alguna por razón de nacimiento, raza, sexo, religión, opinión o cualquier otra condición o circunstancia personal o social».
- Naturaleza: Derecho subjetivo fundamental tutelable de modo directo.
- Garantías: Tutela judicial ante tribunales ordinarios por procedimiento preferente y sumario y Recurso de Amparo ante el Tribunal Constitucional (Art. 53.2).
- Trampa de examen: El Art. 14 NO tiene reserva de Ley Orgánica (Art. 81 solo cubre Sección 1ª) y se reforma por el procedimiento ordinario del Art. 167 (¡NO por el Art. 168!).

3. DERECHOS FUNDAMENTALES Y LIBERTADES PÚBLICAS (SECCIÓN 1ª: ARTS. 15 AL 29)
Nivel de máxima protección constitucional:
- Art. 15: Vida e integridad física y moral. Pena de muerte abolida salvo leyes penales militares en tiempo de guerra.
- Art. 16: Libertad ideológica, religiosa y de culto. Ninguna confesión tendrá carácter estatal.
- Art. 17: Libertad y seguridad. Detención preventiva: plazo máximo de 72 horas para puesta a disposición judicial o libertad. Regulación de Habeas Corpus para puesta a disposición judicial inmediata.
- Art. 18: Honor, intimidad y propia imagen. Inviolabilidad del domicilio: entrada solo por consentimiento, resolución judicial o flagrante delito. Secreto de las comunicaciones salvo resolución judicial.
- Art. 19: Libertad de residencia y circulación por el territorio nacional, y salida/entrada en España.
- Art. 20: Libertad de expresión, creación e información veraz. Prohibición taxativa de censura previa. Secuestro de publicaciones solo por resolución judicial.
- Art. 21: Derecho de reunión pacífica y sin armas. Lugares cerrados sin autorización. Manifestaciones y lugares de tránsito: comunicación previa (no autorización).
- Art. 22: Derecho de asociación. Inscripción registral a solos efectos de publicidad. Prohibidas asociaciones secretas y paramilitares. Disolución solo por resolución judicial motivada.
- Art. 23: Participación política en asuntos públicos y acceso en igualdad a funciones y cargos públicos.
- Art. 24: Tutela judicial efectiva sin indefensión. Presunción de inocencia, no declarar contra sí mismo y asistencia letrada.
- Art. 25: Legalidad penal y sancionadora (tipicidad e irretroactividad). Penas orientadas a reeducación y reinserción. La Administración civil no puede imponer sanciones privativas de libertad.
- Art. 26: Prohibición de Tribunales de Honor en el ámbito civil y militar.
- Art. 27: Derecho a la educación y libertad de enseñanza. Enseñanza básica obligatoria y gratuita. Autonomía universitaria.
- Art. 28: Libertad de sindicación (28.1) y derecho de huelga (28.2) con garantía de servicios esenciales.
- Art. 29: Derecho de petición individual y colectiva, por escrito. Miembros de FF.AA. solo individualmente.

4. DERECHOS Y DEBERES DE LOS CIUDADANOS (SECCIÓN 2ª: ARTS. 30 AL 38)
Nivel ordinario de protección:
- Art. 30: Deber de defender a España. Objeción de conciencia (Art. 30.2: ¡único precepto de la Sección 2ª con Recurso de Amparo ante el TC!).
- Art. 31: Deber de contribuir al gasto público mediante sistema tributario justo, progresivo y no confiscatorio.
- Art. 32: Derecho al matrimonio con plena igualdad jurídica.
- Art. 33: Propiedad privada y herencia. Función social. Expropiación forzosa solo por causa de utilidad pública o interés social mediante indemnización.
- Art. 34: Derecho de fundación.
- Art. 35: Deber y derecho al trabajo, libre elección y remuneración suficiente.
- Art. 36: Colegios Profesionales y profesiones tituladas.
- Art. 37: Negociación colectiva y medidas de conflicto colectivo laboral.
- Art. 38: Libertad de empresa en el marco de la economía de mercado.

5. PRINCIPIOS RECTORES DE LA POLÍTICA SOCIAL Y ECONÓMICA (ARTS. 39 AL 52)
No son derechos subjetivos directamente exigibles ante tribunales. Solo pueden alegarse ante la jurisdicción ordinaria según las leyes que los desarrollen (Art. 53.3).
- Áreas: Familia y menores (39), Seguridad Social (41), salud y deporte (43), cultura y ciencia (44), medio ambiente (45), patrimonio histórico (46), vivienda digna (47), juventud (48), atención a personas con discapacidad (Art. 49, reformado en 2024), pensiones de tercera edad (50), consumidores (51).

6. SISTEMA DE GARANTÍAS DE LOS DERECHOS (ART. 53 CE)
- Nivel 1 (Superprotegido: Art. 14, Arts. 15-29 y Art. 30.2): Reserva de Ley Orgánica (Art. 81 para 15-29) + Procedimiento preferente y sumario judicial + Recurso de Amparo ante TC + Reforma agravada Art. 168 (solo 15-29).
- Nivel 2 (Ordinario: Arts. 30-38): Reserva de ley ordinaria (53.1) + Veto a Decreto-Ley (86.1) + Tutela judicial ordinaria. ¡NO cabe Amparo ni procedimiento sumario (salvo 30.2)! + Reforma ordinaria Art. 167.
- Nivel 3 (Principios Rectores: Arts. 39-52): Informan legislación, práctica judicial y actuación pública (53.3). Solo alegables según leyes de desarrollo. ¡Sin amparo directo!

7. SUSPENSIÓN DE DERECHOS (ART. 55 CE)
A) Suspensión General (Art. 55.1) en Estados de Excepción y Sitio:
- ¡OJO AL TRIBUNAL!: En el estado de alarma NO se suspende ningún derecho fundamental (solo cabe limitar la circulación o permanencia).
- Derechos suspendibles en Excepción y Sitio: Arts. 17.1-2, 18.2-3, 19, 20.1a/d, 20.5, 21, 28.2 y 37.2.
- En Estado de Sitio se añade además la suspensión del Art. 17.3 (información de derechos al detenido) y Art. 17.4 (habeas corpus).
B) Suspensión Individual (Art. 55.2):
Por Ley Orgánica para investigaciones de bandas armadas o elementos terroristas: Arts. 17.2, 18.2 y 18.3, con obligada intervención judicial y control parlamentario.

8. EL DEFENSOR DEL PUEBLO (ART. 54 CE Y LO 3/1981)
- Alto comisionado de las Cortes Generales para la defensa de los derechos del Título I.
- Nombramiento por mayoría de 3/5 de cada Cámara (Congreso y Senado) por un mandato de 5 años.
- Independiente, inamovible e inviolable por opiniones en el ejercicio de sus funciones.
- Supervisa la Administración del Estado, autonómica y local. Rinde informe anual a las Cortes.
- Legitimación extraordinaria ante el Tribunal Constitucional para Recurso de Inconstitucionalidad y Recurso de Amparo.`,

    ss11: `TEMA 11. EL SISTEMA DE LA SEGURIDAD SOCIAL: PRINCIPIOS, ESTRUCTURA Y LA LEY GENERAL DE LA SEGURIDAD SOCIAL (LGSS - RDL 8/2015).

1. FUNDAMENTO CONSTITUCIONAL (ART. 41 CE)
- Los poderes públicos mantendrán un régimen público de Seguridad Social para todos los ciudadanos.
- Garantizará la asistencia y prestaciones sociales suficientes ante situaciones de necesidad, especialmente en caso de desempleo.
- La asistencia y prestaciones complementarias serán libres.
- Naturaleza jurídica: Principio rector de la política social y económica (Capítulo III del Título I).

2. PRINCIPIOS INFORMADORES BÁSICOS
- Universalidad subjetiva: Extensión del campo de aplicación a toda la ciudadanía española y residentes legales.
- Solidaridad intergeneracional e interterritorial: Financiación de las pensiones y prestaciones actuales con las cotizaciones actuales de trabajadores y empresas (sistema de reparto).
- Unidad de caja: La Tesorería General de la Seguridad Social (TGSS) es titular exclusiva de todos los recursos y obligaciones patrimoniales del sistema (principio sagrado e indivisible que impide la fragmentación de la caja común).
- Contributividad y proporcionalidad: Correlación entre el esfuerzo contributivo a lo largo de la vida laboral y la cuantía de las prestaciones económicas.
- Gestión pública y control estatal: Administrada por entidades públicas con personalidad jurídica (INSS, TGSS, ISM), con participación de los agentes sociales.

3. ESTRUCTURA LEGAL DE LA LGSS (RDL 8/2015)
- Título I (Arts. 1 a 135): Normas generales del sistema (campo de aplicación, afiliación, cotización, recaudación y acción protectora).
- Título II (Arts. 136 a 261): Régimen General de la Seguridad Social (trabajadores por cuenta ajena).
- Título III (Arts. 262 a 304): Protección por desempleo (contributivo y asistencial).
- Título IV (Arts. 305 a 326): Régimen Especial de Trabajadores Autónomos (RETA) y nuevo sistema de cotización por rendimientos netos.
- Título V (Arts. 327 a 350): Régimen Especial de la Minería del Carbón.
- Título VI (Arts. 351 a 373): Prestaciones no contributivas (invalidez y jubilación).`,

    ss14: `TEMA 14. AFILIACIÓN DE TRABAJADORES, ALTAS Y BAJAS EN LA SEGURIDAD SOCIAL (LGSS Y RD 84/1996).

1. ACTOS DE ENCUADRAMIENTO: CONCEPTOS Y CARACTERES
- Afiliación: Acto administrativo mediante el cual la TGSS incorpora al sistema a la persona que por vez primera realiza una actividad laboral. Es obligatoria, única para toda la vida del trabajador y general para todos los regímenes.
- Número de Afiliación (NAF): Identificador numérico e invariable en todo el territorio nacional.

2. ALTAS Y BAJAS: PLAZOS PERENTORIOS DE EXAMEN
- Alta previa: La solicitud de alta debe formularse con carácter PREVIO al inicio de la prestación de servicios, con un máximo de 60 días naturales de antelación.
- Bajas y variaciones de datos: Deben presentarse en el plazo improrrogable de 3 DÍAS NATURALES siguientes al cese en el trabajo o cambio de situación.
- Trampas de examen: ¡No son días hábiles, son naturales! Y el alta previa no puede ser el mismo día a posteriori salvo causa de fuerza mayor debidamente acreditada.

3. CLASES DE ALTAS
- Alta real: El trabajador inicia efectivamente la actividad laboral.
- Alta asimilada: Situaciones donde no hay trabajo efectivo pero se mantiene la protección (ej. desempleo contributivo, excedencia forzosa, huelga legal, maternidad/paternidad).
- Alta presunta o de pleno derecho: El trabajador tiene derecho a las prestaciones de accidentes de trabajo y enfermedades profesionales aunque el empresario haya incumplido su deber de darle de alta.

4. EFECTOS DEL INCUMPLIMIENTO
- Altas tardías o extemporáneas promovidas por el empresario: Solo surten efectos desde el día de la solicitud, sin efecto retroactivo.
- Altas de oficio por la Inspección de Trabajo y Seguridad Social (ITSS): Retroactividad a la fecha en que se inició la actividad laboral acreditada, con derivación de responsabilidad empresarial de pago de cuotas y recargos.`

  function getOfficialAcademyNotes(t) {
    if (!t) return '';
    const id = t.id || '';
    if (officialAcademyNotes[id]) return officialAcademyNotes[id];
    return '';
  }

  function loadAcademyNotesForCurrentTopic() {
    const t = currentTopic();
    if (!t) return;
    const notes = getOfficialAcademyNotes(t);
    if (!notes) {
      toast('Este tema puede completarse pegando apuntes o subiendo su PDF.');
      return;
    }
    t.text = notes;
    t.updated = Date.now();
    save();
    renderRoute(false);
    toast('¡Apuntes oficiales de academia cargados con éxito en este tema!');
    petReact(true);
  }

  function home(){const o=opp(),studied=o.topics.filter(t=>t.rounds>0).length,pct=o.topics.length?Math.round(100*studied/o.topics.length):0,recent=state.recent.filter(r=>r.opp===o.id&&topic(r.topic)).slice(0,2);const day=new Date().toLocaleDateString('es-ES',{weekday:'long',day:'numeric',month:'long'});return `<div class="page"><section class="page-intro home-head"><div><div class="eyebrow intro-kicker">Tu espacio de estudio</div><h1>Mi escritorio${titleDoodle}</h1><p>Un tema, un repaso y un paso más hacia tu plaza.</p></div><div class="intro-actions"><span class="today-label">${I('calendar',14)}${esc(day.charAt(0).toUpperCase()+day.slice(1))}</span><button class="btn" data-act="new-opp" aria-label="Nueva oposición">${I('plus',15)}Nueva oposición</button></div></section><div class="desk-grid"><div class="desk-main"><section class="opposition-panel"><div><button class="active-opp" data-act="switch-opp"><i class="dot"></i> OPOSICIÓN ACTIVA ${I('down',11)}</button><h2 class="opp-name">${esc(o.name)}</h2><div class="opp-meta"><span>${I('folder',13)}${esc(o.short||'Grupo '+o.group)}</span><span>${I('layers',13)}${o.blocks.length} bloques</span><span>${I('file',13)}${o.topics.length} temas oficiales</span></div><div class="opp-actions"><button class="btn primary" data-act="continue">Continuar estudio ${I('arrow',14)}</button><button class="btn sm" onclick="studyAgendaModal()" style="background:#fff;border:1.5px solid #d9d1f0;color:#553396;font-weight:600">📅 Mi Agenda y Calendario</button><button class="text-btn" data-act="open-bases">Bases oficiales ${I('external',12)}</button><button class="btn sm" data-act="${o.id==='gace-a2'?'switch-to-c1':'switch-to-gace'}" style="margin-left:8px;background:#f0eef9;color:#6e48aa;border:1px solid #d9d1f0">${o.id==='gace-a2'?'🏢 Ver Admin C1':'🎯 Activar GACE A2 (58 temas)'}</button><button class="btn sm" data-act="${/seguridad\s+social/i.test(o.name)?'switch-to-gace':'switch-to-ss-c1'}" style="margin-left:6px;background:#eef6fc;color:#1e40af;border:1px solid #bfdbfe">${/seguridad\s+social/i.test(o.name)?'🎯 Cambiar a GACE A2':'🛡️ Seguridad Social C1 (36 temas)'}</button></div></div>${notebookArt()}<div class="hero-progress"><div class="progress-info"><span>Progreso del temario</span><span><b>${pct}%</b> <span style="opacity:.65">·</span> ${studied} de ${o.topics.length} temas</span></div><div class="progress-track"><i style="width:${pct}%"></i></div></div></section><section><div class="section-heading"><h2>Herramientas de estudio</h2><span class="section-note">Tu mesa de trabajo</span></div><div class="tool-grid">${tools.map(([k,l,d,c])=>`<button class="tool-tile ${c}" data-go="${k}"><span class="tile-arrow">${I('upRight',15)}</span>${toolArt(artKey(k))}<h3>${l}</h3><p>${d}</p></button>`).join('')}</div></section><section><div class="section-heading"><h2>Últimos apuntes</h2><button class="text-btn" data-go="library">Ver temario ${I('arrow',13)}</button></div><div class="recent-list surface">${recent.length?recent.map(r=>{const t=topic(r.topic);return `<button class="recent-row" data-act="read" data-id="${esc(t.id)}"><span class="file-icon">${I('file',19)}</span><span class="spacer"><span class="recent-title">${esc(t.title)}</span><span class="recent-meta" style="display:block">Bloque ${t.b+1} · ${esc(o.blocks[t.b])}</span></span>${stateLabel(t)}${I('right',14)}</button>`}).join(''):`<button class="recent-row" data-act="import"><span class="file-icon">${I('upload')}</span>Importa tus primeros apuntes ${I('arrow',14)}</button>`}</div></section></div><aside class="desk-side">${journal()}<section class="pet-panel surface"><div class="pet-header"><div><div class="eyebrow">Tu compañero de estudio</div><h2>${esc(state.pet.name)}</h2></div><button class="icon-btn" data-act="pet-settings" aria-label="Personalizar OpoPet">${I('settings',17)}</button></div>${petImage()}<p class="pet-quote">“${esc(petLine('tip'))}”</p><button class="btn" data-act="quick">${I('sparkle',15)}Pregunta rápida</button></section><button class="surface notice-link" data-go="boe"><span class="notice-art">${I('news',20)}</span><span class="spacer"><h3>Convocatorias</h3><p>BOE y boletines autonómicos</p></span>${I('right',14)}</button></aside></div></div>`}
  function petLine(type){const dict={Motivadora:{tip:'Poquito a poco, cada repaso te acerca a tu plaza.',good:'¡Bien hecho! Ese concepto ya es un poco más tuyo.',bad:'Un fallo también enseña. Repasa la explicación y vuelve a intentarlo.'},Estricta:{tip:'Primero comprende el artículo. Después, memoriza el plazo.',good:'Respuesta correcta. Mantén el ritmo.',bad:'Revisa el artículo y distingue el plazo de su cómputo.'},'Sarcástica con los plazos':{tip:'Los plazos no se estudian solos. Ya se lo he preguntado.',good:'¡Exacto! Hoy el calendario está de tu parte.',bad:'El BOE no acepta un «casi». Vamos a repasar esa regla.'}};return (dict[state.pet.personality]||dict.Motivadora)[type]}
  function petReact(ok){clearTimeout(petTimer);$('.pet-bubble')?.remove();const n=document.createElement('div');n.className='pet-bubble '+(ok?'celebrate':'missed');n.setAttribute('role','status');n.innerHTML=petImage()+`<div><b>${esc(state.pet.name)}</b><p>${esc(petLine(ok?'good':'bad'))}</p></div>`;($('#modal').open?$('#modal'):document.body).append(n);n.onclick=()=>n.remove();petTimer=setTimeout(()=>n.remove(),4400)}
  function heading(title,sub,actions='',kicker='Mi espacio de estudio'){return `<div class="page-intro module-head"><div><div class="eyebrow intro-kicker">${esc(kicker)}</div><h1>${esc(title)}</h1><p>${esc(sub)}</p></div>${actions?`<div class="intro-actions">${actions}</div>`:''}</div>`}
  const btn=(label,act,ico='',cl='')=>`<button type="button" class="btn ${cl}" data-act="${act}">${ico?I(ico,15):''}${label}</button>`;
  function switchOpp(){modal('Mis oposiciones',`<p>Cada oposición tiene su propio temario oficial, normativa y repasos:</p><div class="set-list">${state.opps.map(o=>`<button data-act="choose-opp" data-id="${esc(o.id)}" class="${o.id===opp().id?'is-active':''}">${I('book',22)}<span class="spacer"><b>${esc(o.name)}</b><small>${esc(o.group)} · ${o.blocks.length} bloques · ${o.topics.length} temas oficiales</small></span>${o.id===opp().id?I('check'):''}</button>`).join('')}</div><div class="modal-actions" style="display:flex;gap:6px;flex-wrap:wrap;justify-content:space-between"><div class="row wrap" style="gap:6px">${btn('Seguridad Social C1','switch-to-ss-c1','check','soft')}${btn('GACE A2','switch-to-gace','check','soft')}</div>${btn('Nueva oposición','new-opp','plus','primary')}</div>`)}
  function newOpp(){modal('Nueva oposición',`<p>Configura tu cuaderno de oposición o utiliza las plantillas oficiales del Estado:</p><form id="new-opp-form" class="stack"><label class="field"><span>Nombre de la oposición</span><input name="name" required maxlength="100" placeholder="Ej. Administrativo de la Seguridad Social C1" value="Administrativo de la Seguridad Social C1"></label><div class="form-grid compact"><label class="field"><span>Subgrupo</span><select name="group">${['A1','A2','B','C1','C2','AP','Otro'].map(x=>`<option ${x==='C1'?'selected':''}>${x}</option>`).join('')}</select></label><label class="field"><span>Nombre corto</span><input name="short" maxlength="20" placeholder="Ej. SS C1" value="SS C1"></label></div><label class="field"><span>Plantilla oficial inicial</span><select name="template"><option value="ss-c1" selected>Seguridad Social C1 · 36 temas oficiales en 2 bloques (INSS / TGSS)</option><option value="gace">GACE A2 · 58 temas oficiales en 6 bloques (INAP)</option><option value="c1">Administrativo del Estado C1 · 43 temas oficiales</option><option value="c2">Auxiliar Administrativo del Estado C2 · 28 temas oficiales</option><option value="empty">Temario en blanco / personalizado</option></select></label><label class="field"><span>Importar temas <small>(opcional)</small></span><textarea name="topics" placeholder="# Bloque I. Organización del Estado\nTema 1. La Constitución Española\nTema 4. La Corona..."></textarea><small>Un tema por línea. Usa # para bloques o pega JSON.</small></label><label class="field"><span>O elige un archivo TXT / JSON</span><input type="file" name="syllabusFile" accept=".txt,.json,text/plain,application/json"></label><div class="modal-error" id="modal-error"></div><div class="row" style="justify-content:flex-end">${btn('Cancelar','close')}<button class="btn primary" type="submit">${I('plus',15)}Crear oposición</button></div></form>`)}
  function parseSyllabus(text){const bs=[],ts=[];let b='Temario general';function add(title,block,content=''){if(typeof title!=='string'||!title.trim())return;const bn=String(block||b).trim();if(!bs.includes(bn))bs.push(bn);ts.push({id:uid(),title:title.trim().slice(0,200),b:bs.indexOf(bn),text:String(content||'').slice(0,200000),rounds:0,errors:0,source:'',assets:[],updated:0})}if(text.trim().startsWith('[')||text.trim().startsWith('{')){let js;try{js=JSON.parse(text)}catch{throw Error('El JSON no es válido. Comprueba las comillas y las comas.')}const arr=Array.isArray(js)?js:js.temas||js.topics;if(!Array.isArray(arr))throw Error('El JSON debe contener una lista de temas.');arr.slice(0,500).forEach(t=>typeof t==='string'?add(t,b):add(t?.titulo||t?.title,t?.bloque||t?.block,t?.texto||t?.text))}else{for(const line of text.split('\n').slice(0,600)){if(line.trim().startsWith('#'))b=line.replace(/^\s*#+\s*/,'').trim()||b;else add(line.replace(/^\s*[-*]\s*/,''),b)}}return {blocks:bs.length?bs:['Temario general'],topics:ts}}
  function planModal(){const ds=daysOfWeek(),sum=ds.reduce((v,d)=>v+(dateKey(d)===dateKey()?elapsedToday():state.days[dateKey(d)]||0),0);modal('Mi planificador',`<p>Un objetivo sostenible para los siete días de la semana.</p><div class="between"><b>Esta semana</b><span class="tag">${humanMins(sum/60)} de ${humanMins(state.goal*7)}</span></div><div class="stack" style="gap:0;margin:10px 0 19px">${ds.map(d=>{const s=dateKey(d)===dateKey()?elapsedToday():(state.days[dateKey(d)]||0);return `<div class="history-row"><span>${esc(d.toLocaleDateString('es-ES',{weekday:'long',day:'numeric'}))}</span><span>${humanMins(s/60)} / ${humanMins(state.goal)}</span></div>`}).join('')}</div><form id="goal-form" class="stack"><label class="field"><span>Objetivo diario en minutos</span><input required name="goal" type="number" min="5" max="720" value="${state.goal}"></label><button class="btn primary">Guardar planificación</button></form>`)}
  function studyAgendaModal() {
    const o = opp();
    const today = new Date();
    const curYear = today.getFullYear();
    const curMonth = today.getMonth();
    
    if (!state.examDate) {
      const future = new Date();
      future.setMonth(future.getMonth() + 4);
      future.setDate(20);
      state.examDate = dateKey(future);
    }
    
    state.scheduledReviews = state.scheduledReviews || [];
    
    const examD = new Date(state.examDate + 'T00:00:00');
    const todayMidnight = new Date();
    todayMidnight.setHours(0, 0, 0, 0);
    const diffTime = examD.getTime() - todayMidnight.getTime();
    const diffDays = Math.ceil(diffTime / (1000 * 60 * 60 * 24));
    
    const firstDayOfMonth = new Date(curYear, curMonth, 1);
    const daysInMonth = new Date(curYear, curMonth + 1, 0).getDate();
    let startingDay = (firstDayOfMonth.getDay() + 6) % 7; 
    
    const monthNames = ['Enero', 'Febrero', 'Marzo', 'Abril', 'Mayo', 'Junio', 'Julio', 'Agosto', 'Septiembre', 'Octubre', 'Noviembre', 'Diciembre'];
    const currentMonthName = monthNames[curMonth];
    
    const ds = daysOfWeek();
    const weekSecs = ds.reduce((v, d) => v + (dateKey(d) === dateKey() ? elapsedToday() : state.days[dateKey(d)] || 0), 0);
    const weekGoalSecs = state.goal * 60 * 7;
    const weekPct = Math.min(100, Math.round((weekSecs / weekGoalSecs) * 100));

    let calendarCells = '';
    for (let i = 0; i < startingDay; i++) {
      calendarCells += `<div class="agenda-day-cell empty"></div>`;
    }
    for (let dayNum = 1; dayNum <= daysInMonth; dayNum++) {
      const cellDate = new Date(curYear, curMonth, dayNum);
      const k = dateKey(cellDate);
      const isToday = k === dateKey();
      const secs = (isToday ? elapsedToday() : state.days[k] || 0);
      const goalMet = secs >= (state.goal * 60);
      const hasStudied = secs > 0;
      
      const reviewsOnDay = (state.scheduledReviews || []).filter(r => r.date === k);
      
      calendarCells += `
        <div class="agenda-day-cell ${isToday ? 'is-today' : ''} ${goalMet ? 'goal-met' : hasStudied ? 'has-studied' : ''}" data-date="${k}">
          <div class="agenda-day-num">
            <span>${dayNum}</span>
            ${isToday ? '<span class="today-dot" title="Hoy"></span>' : ''}
          </div>
          <div class="agenda-day-info">
            ${secs > 0 ? `<span class="agenda-time-badge ${goalMet ? 'met' : ''}">${humanMins(secs / 60)}</span>` : ''}
            ${reviewsOnDay.map(r => `<span class="agenda-topic-tag" title="${esc(r.title)}">📖 ${esc(r.shortTitle || r.title.slice(0, 11))}</span>`).join('')}
          </div>
        </div>
      `;
    }

    const modalHTML = `
      <div class="study-agenda-modal stack" style="gap:16px">
        <div class="agenda-countdown-card" style="background:linear-gradient(135deg, #f3edf9 0%, #ebe4f5 100%);border:1.5px solid #d9d1f0;border-radius:14px;padding:16px;display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:12px">
          <div class="row" style="gap:14px;align-items:center">
            <div style="width:48px;height:48px;border-radius:12px;background:#6e48aa;color:#fff;display:flex;align-items:center;justify-content:center;font-size:24px;box-shadow:0 3px 10px rgba(110,72,170,0.3)">
              ⏳
            </div>
            <div>
              <div style="font-weight:800;font-size:17px;color:#432874">
                ${diffDays > 0 ? `${diffDays} días para tu examen oficial` : diffDays === 0 ? '¡HOY ES EL DÍA DEL EXAMEN!' : 'Fecha de examen concluida'}
              </div>
              <div class="small muted" style="margin-top:2px">
                Oposición: <strong>${esc(o.short || o.name)}</strong> · Fecha fijada: <strong>${examD.toLocaleDateString('es-ES', { day: 'numeric', month: 'long', year: 'numeric' })}</strong>
              </div>
            </div>
          </div>
          <div class="row" style="gap:8px">
            <button class="btn sm" onclick="changeExamDatePrompt()" style="background:#fff;border:1.5px solid #c9bee5;color:#553396;font-weight:600">
              ${I('calendar', 13)} Modificar fecha
            </button>
            <button class="btn sm primary" onclick="toggleSession(); closeModal();">
              ${I(state.session ? 'pause' : 'play', 12)} ${state.session ? 'Pausar estudio' : 'Iniciar estudio ya'}
            </button>
          </div>
        </div>

        <div class="row wrap between" style="background:#faf8f5;border:1px solid var(--line);border-radius:12px;padding:12px 16px;gap:12px">
          <div>
            <span class="tiny muted" style="text-transform:uppercase;letter-spacing:.8px;display:block">Tiempo estudiado esta semana</span>
            <strong style="font-size:15px;color:var(--deep)">${humanMins(weekSecs / 60)}</strong>
            <span class="small muted">de ${humanMins(weekGoalSecs / 60)} (${weekPct}%)</span>
          </div>
          <div>
            <span class="tiny muted" style="text-transform:uppercase;letter-spacing:.8px;display:block">Meta diaria</span>
            <strong style="font-size:15px;color:#553396">${state.goal} min/día</strong>
          </div>
          <div>
            <span class="tiny muted" style="text-transform:uppercase;letter-spacing:.8px;display:block">Racha activa</span>
            <strong style="font-size:15px;color:#1d6f42">🔥 ${streak()} días seguidos</strong>
          </div>
          <button class="btn sm soft" onclick="planModal()">${I('settings', 12)} Ajustar objetivo</button>
        </div>

        <div class="agenda-calendar-box surface" style="border:1px solid var(--line);border-radius:12px;padding:16px;">
          <div class="row between" style="margin-bottom:12px">
            <h3 style="margin:0;font-size:15px;color:var(--deep);display:flex;align-items:center;gap:6px">
              <span>📅</span> ${currentMonthName} de ${curYear}
            </h3>
            <div class="row" style="gap:6px">
              <span class="badge" style="background:#eaf5ea;color:#1d6f42;border:1px solid #c7e3c7;font-size:11px">● Meta cumplida</span>
              <span class="badge" style="background:#f0eef9;color:#553396;border:1px solid #d9d1f0;font-size:11px">● Repaso agendado</span>
            </div>
          </div>

          <div class="agenda-weekdays-grid">
            <span>Lun</span><span>Mar</span><span>Mié</span><span>Jue</span><span>Vie</span><span>Sáb</span><span>Dom</span>
          </div>

          <div class="agenda-calendar-grid">
            ${calendarCells}
          </div>
        </div>

        <div class="surface" style="border:1px solid var(--line);border-radius:12px;padding:16px;">
          <div class="row between wrap" style="margin-bottom:10px">
            <h4 style="margin:0;color:var(--deep);font-size:14px;display:flex;align-items:center;gap:6px">
              <span>🎯</span> Planificar Repaso de Temario
            </h4>
            <span class="tiny muted">Organiza vueltas al temario según tu curva del olvido</span>
          </div>
          
          <form onsubmit="scheduleReviewSubmit(event)" class="row wrap" style="gap:8px;align-items:flex-end">
            <label class="field" style="flex:2;min-width:200px;margin:0">
              <span style="font-size:11px">Seleccionar tema</span>
              <select name="topicId" id="sched-topic" required style="padding:7px 10px;font-size:12.5px">
                ${o.topics.map(t => `<option value="${esc(t.id)}">${esc(t.title)}</option>`).join('')}
              </select>
            </label>
            <label class="field" style="flex:1;min-width:130px;margin:0">
              <span style="font-size:11px">Fecha de repaso</span>
              <input type="date" name="reviewDate" id="sched-date" required value="${dateKey()}" style="padding:6px 8px;font-size:12.5px">
            </label>
            <button class="btn primary sm" type="submit" style="height:36px">
              ${I('plus', 12)} Agendar repaso
            </button>
          </form>

          ${(state.scheduledReviews && state.scheduledReviews.length) ? `
            <div class="stack" style="gap:6px;margin-top:12px">
              <span class="tiny muted" style="font-weight:700">Próximos temas agendados:</span>
              ${state.scheduledReviews.slice(0, 5).map((r, idx) => `
                <div class="row between" style="padding:6px 10px;background:#fdfcf9;border:1px solid #eee;border-radius:8px;font-size:12px">

                  <div class="row" style="gap:6px">
                    <button class="text-btn tiny" onclick="closeModal();go('reader','${esc(r.topicId)}')">Estudiar ahora</button>
                    <button class="icon-btn tiny" onclick="removeScheduledReview(${idx})" title="Eliminar">✕</button>
                  </div>
                </div>
              `).join('')}
            </div>
          ` : '<p class="tiny muted" style="margin-top:10px">No tienes repasos programados para los próximos días. Agenda uno arriba.</p>'}
        </div>
      </div>
    `;

    modal('Mi Agenda y Calendario de Estudio', modalHTML, true);
  }

  function changeExamDatePrompt() {
    modal('Fecha Objetivo del Examen', `
      <form onsubmit="event.preventDefault(); const val=this.examDate.value; if(val){ state.examDate=val; save(); toast('Fecha de examen guardada.'); studyAgendaModal(); }" class="stack">
        <p class="small muted">Introduce la fecha prevista de tu examen oficial para el cálculo exacto de días:</p>
        <label class="field"><span>Fecha del examen oficial</span>
          <input type="date" name="examDate" required value="${esc(state.examDate || dateKey())}">
        </label>
        <div class="modal-actions">
          <button class="btn" type="button" onclick="studyAgendaModal()">Volver a la Agenda</button>
          <button class="btn primary" type="submit">${I('check', 12)} Guardar fecha</button>
        </div>
      </form>
    `);
  }

  function scheduleReviewSubmit(e) {
    e.preventDefault();
    const form = e.target;
    const topicId = form.topicId.value;
    const date = form.reviewDate.value;
    const t = topic(topicId);
    if (!t) return;
    state.scheduledReviews = state.scheduledReviews || [];
    state.scheduledReviews.push({
      topicId: t.id,
      title: t.title,
      shortTitle: t.title.slice(0, 16),
      date: date
    });
    state.scheduledReviews.sort((a, b) => a.date.localeCompare(b.date));
    save();
    toast('Repaso de «' + t.title.slice(0, 25) + '...» agendado para el ' + date);
    studyAgendaModal();
  }

  function removeScheduledReview(idx) {
    if (state.scheduledReviews && state.scheduledReviews[idx]) {
      state.scheduledReviews.splice(idx, 1);

  async function extractPDF(file,progress){if(!pdfEngine){const base='https://cdn.jsdelivr.net/npm/pdfjs-dist@4.10.38/build/';const [main,worker]=await Promise.all([cachedModule(base+'pdf.min.mjs','@pdf-main-4.10'),cachedModule(base+'pdf.worker.min.mjs','@pdf-worker-4.10')]);pdfEngine=await import(main);pdfEngine.GlobalWorkerOptions.workerSrc=worker}const pdf=await pdfEngine.getDocument({data:new Uint8Array(await file.arrayBuffer()),isEvalSupported:false,useSystemFonts:true}).promise;let out=[];try{for(let i=1;i<=pdf.numPages;i++){progress('Extrayendo texto: página '+i+' de '+pdf.numPages);const p=await pdf.getPage(i),c=await p.getTextContent();out.push(c.items.map(x=>(x.str||'')+(x.hasEOL?'\n':' ')).join(''));p.cleanup()}return out.join('\n\n')}finally{await pdf.destroy()}}

  async function extractDocxText(buffer) {
    try {
      const bytes = new Uint8Array(buffer);
      const view = new DataView(bytes.buffer, bytes.byteOffset, bytes.byteLength);
      let pos = 0;
      while (pos < bytes.length - 30) {
        if (view.getUint32(pos, true) === 0x04034b50) {
          const compMethod = view.getUint16(pos + 8, true);
          const compSize = view.getUint32(pos + 18, true);
          const fnLen = view.getUint16(pos + 26, true);
          const extraLen = view.getUint16(pos + 28, true);
          const fnBytes = bytes.subarray(pos + 30, pos + 30 + fnLen);
          const filename = new TextDecoder().decode(fnBytes);
          const dataStart = pos + 30 + fnLen + extraLen;
          if (filename === 'word/document.xml') {
            let xmlText = '';
            if (compMethod === 8) {
              const stream = new ReadableStream({
                start(c) { c.enqueue(bytes.subarray(dataStart, dataStart + compSize)); c.close(); }
              }).pipeThrough(new DecompressionStream('deflate-raw'));
              xmlText = await new Response(stream).text();
            } else if (compMethod === 0) {
              xmlText = new TextDecoder().decode(bytes.subarray(dataStart, dataStart + compSize));
            }
            return xmlText
              .replace(/<w:p[^>]*>/g, '\n')
              .replace(/<w:br[^>]*>/g, '\n')
              .replace(/<w:tab[^>]*>/g, '\t')
              .replace(/<[^>]+>/g, '')
              .replace(/&amp;/g, '&')
              .replace(/&lt;/g, '<')
              .replace(/&gt;/g, '>')
              .replace(/&quot;/g, '"')
              .replace(/&apos;/g, "'")
              .trim();
          }
          pos = dataStart + compSize;
        } else {
          pos++;
        }
      }
    } catch(e) {}
    return '';
  }

  async function extractPdfRaw(buffer) {
    try {
      const bytes = new Uint8Array(buffer);
      const rawStr = new TextDecoder('latin1').decode(bytes);
      const chunks = [];
      const streamRegex = /stream\r?\n([\s\S]*?)\r?\nendstream/g;
      let match;
      while ((match = streamRegex.exec(rawStr)) !== null) {
        const content = match[1];
        const tjMatches = [...content.matchAll(/\(([^)]+)\)\s*Tj/g)];
        for (const m of tjMatches) {
          if (m[1].length > 1 && !/^[\x00-\x1f]+$/.test(m[1])) chunks.push(m[1]);
        }
        const tjArrayMatches = [...content.matchAll(/\[([^\]]+)\]\s*TJ/g)];
        for (const m of tjArrayMatches) {
          const innerStrings = [...m[1].matchAll(/\(([^)]+)\)/g)].map(x => x[1]).join('');
          if (innerStrings.length > 1 && !/^[\x00-\x1f]+$/.test(innerStrings)) chunks.push(innerStrings);
        }
      }
      return chunks.join(' ').replace(/\s+/g, ' ').trim();
    } catch(e) {
      return '';
    }
  }

  function getFileType(filename) {
    if (/\.pdf$/i.test(filename)) return 'pdf';
    if (/\.docx$/i.test(filename)) return 'docx';
    if (/\.(doc|odt|rtf|txt|md|markdown)$/i.test(filename)) return 'doc';
    if (/\.(mp3|m4a|wav|ogg|aac|flac)$/i.test(filename)) return 'audio';
    if (/\.(mp4|webm|mov|mkv)$/i.test(filename)) return 'video';
    if (/\.(pptx|ppt|odp)$/i.test(filename)) return 'slides';
    return 'other';
  }

  async function doImport(form){
    const fd=new FormData(form),raw=String(fd.get('text')||'').trim(),files=[...pendingFiles];
    if(!raw&&!files.length)throw Error('Añade un archivo o pega texto antes de guardar.');
    if(files.some(f=>f.size>100*1024*1024))throw Error('Cada archivo debe ocupar menos de 100 MB.');

    const isNew = fd.get('topic') === 'new';
    const status = msg => { const s=$('#import-status'); if(s)s.textContent=msg; };

    // Auto classification mode for multiple files
    if (isAuto && files.length > 0) {
      let importedCount = 0;
      for (const f of files) {
        const targetTopic = matchTopicForFile(f.name);
        const key = uid();
        const fType = getFileType(f.name);
        status('Clasificando '+f.name+' en «'+targetTopic.title+'»...');
        await fileStore('put', key, f);
        targetTopic.assets = [...(targetTopic.assets || []), { id: key, name: f.name, pdf: fType === 'pdf', type: fType }];
        
        let extracted = '';
        if (fType === 'pdf') {
          try {
            extracted = await extractPDF(f, status);
          } catch(e) {
            try { extracted = await extractPdfRaw(await f.arrayBuffer()); } catch(e2) {}
          }
        } else if (fType === 'docx') {
          try {
            status('Extrayendo texto del documento Word...');
            extracted = await extractDocxText(await f.arrayBuffer());
          } catch(e) {}
        } else if (fType === 'doc') {
          try {
            extracted = await f.text();
          } catch(e) {}
        }
        // Audio, video, slides: NEVER call f.text()!
        if (extracted.trim()) {
          targetTopic.text = [targetTopic.text, extracted].filter(Boolean).join('\n\n');
        }
        targetTopic.updated = Date.now();
        importedCount++;
      }
      save();
      closeModal();
      renderRoute(false);
      toast('¡'+importedCount+' archivos clasificados en sus respectivos temas y bloques!');
      petReact(true);
      return;
    }

    // Single topic or new topic mode
    const t = isNew
      ? { id: uid(), title: String(fd.get('title') || files[0]?.name.replace(/\.[^.]+$/, '') || 'Mis apuntes').trim(), b: 0, rounds: 0, errors: 0, text: '', assets: [], source: '', updated: Date.now() }
      : topic(fd.get('topic'));
    if(!t) throw Error('El tema seleccionado no está disponible.');
    const chunks = [], assets = [];
    let warning = '';
    let hasMediaOnly = true;

    for (const f of files) {
      const key = uid();
      const fType = getFileType(f.name);
      status('Guardando '+f.name+'...');
      await fileStore('put', key, f);
      assets.push({ id: key, name: f.name, pdf: fType === 'pdf', type: fType });
      if (fType === 'pdf') {
        hasMediaOnly = false;
        try {
          const txt = await extractPDF(f, status);
          if (txt.trim()) chunks.push(txt);
          else {
            const rawFallback = await extractPdfRaw(await f.arrayBuffer());
            if (rawFallback.trim()) chunks.push(rawFallback);
            else warning = 'El PDF no tiene texto seleccionable. Añade una transcripción para generar herramientas.';
          }
        } catch {
          try {
            const rawFallback = await extractPdfRaw(await f.arrayBuffer());
            if (rawFallback.trim()) chunks.push(rawFallback);
            else warning = 'PDF guardado. No se pudo extraer el texto: puede ser un escaneo o estar protegido.';
          } catch(e) {
            warning = 'PDF guardado. No se pudo extraer el texto: puede ser un escaneo o estar protegido.';
          }
        }
      } else if (fType === 'docx') {
        hasMediaOnly = false;
        try {
          status('Extrayendo texto de Word...');
          const txt = await extractDocxText(await f.arrayBuffer());
          if (txt.trim()) chunks.push(txt);
        } catch(e) {}
      } else if (fType === 'doc') {
        hasMediaOnly = false;
        try {
          const txt = await f.text();
          if (txt.trim()) chunks.push(txt);
        } catch(e) {}
      }
      // Audio, video, slides: NEVER call f.text() to prevent freezes and memory bloat
    }
    if (raw) {
      chunks.push(raw);
      hasMediaOnly = false;
    }
    if (!hasMediaOnly || fd.get('replace')) {
      t.text = [fd.get('replace') ? '' : t.text, ...chunks].filter(Boolean).join('\n\n');
    }
    t.assets = [...(t.assets || []), ...assets];
    if (fd.get('source')) t.source = safeURL(fd.get('source'));
    t.updated = Date.now();
    if (isNew) o.topics.push(t);
    remember(t);
    readerTab = 'outline';
    sourceTab = assets.some(a => a.pdf) ? 'pdf' : 'text';
    go('reader', t.id);
    toast(warning || (hasMediaOnly ? 'Archivo multimedia guardado en el tema.' : 'Apuntes guardados en tu cuaderno.'));
    if (warning) setTimeout(() => modal('PDF guardado', `<div class="notice">${esc(warning)}</div><div class="modal-actions">${btn('Entendido','close','check','primary')}</div>`), 150);
  }

  const keyRX=/(\b(?:\d+|un|una|dos|tres|cuatro|cinco|diez|quince|veintidós)\s+(?:días?(?:\s+(?:hábiles|naturales))?|mes(?:es)?|años?|horas?)\b|mayoría\s+(?:absoluta|simple|cualificada)|silencio\s+(?:administrativo|positivo|negativo|desestimatorio|estimatorio)|(?:superior jerárquico|órgano competente|Consejo de Ministros|órgano de contratación)|recurso\s+(?:potestativo de reposición|de alzada|de reposición)|\d[\d.]*\s*euros)/gi;

  function summarize(text){const total=words(text).length,budget=Math.floor(total*.28);if(!budget)return [];if(text===noteProcedure)return ['Subsanación: 10 días; desistimiento previa resolución si no se subsana.','Días hábiles: excluir sábados, domingos y festivos. Inicio: día siguiente.','Audiencia: entre 10 y 15 días.','Alzada: superior jerárquico. Interposición contra acto expreso: un mes; resolución: tres meses.','Reposición: mismo órgano. Resolución y notificación: un mes.'];const pieces=sentences(text).flatMap(s=>s.split(/;\s*|:\s+(?=[A-ZÁÉÍÓÚ])/)).map((s,i)=>({s:s.replace(/^(?:En primer lugar,? |Cabe destacar que |Es importante señalar que |Por otra parte,? |Como hemos visto,? )/i,'').trim(),i})).filter(x=>words(x.s).length>=3);pieces.forEach(x=>{x.score=(x.s.match(keyRX)||[]).length*5+(/\b(debe|plazo|competent|requisito|define|consiste|principio|excep|función|efecto)/i.test(x.s)?3:0)+(/\d/.test(x.s)?1:0)});let left=budget;const out=[];for(const x of pieces.sort((a,b)=>b.score-a.score||a.i-b.i)){const ws=words(x.s);if(ws.length<=left&& !out.some(y=>y.s===x.s)){out.push(x);left-=ws.length}if(left<3)break}if(!out.length&&pieces.length){const x=pieces[0];out.push({i:x.i,s:x.s})}return out.sort((a,b)=>a.i-b.i).map(x=>x.s)}

  function buildDynamicTables(t) {
    const raw = String(t.text || '').trim();
    if (!raw) return [];
    const lines = raw.split(/\n+/).map(l => l.trim()).filter(Boolean);
    const sents = sentences(raw);

    // 1. Table: Plazos, Términos y Quórums de Examen
    const plazosRows = [];
    for (const s of sents) {
      const timeM = s.match(/(?:\d+|un|una|dos|tres|cuatro|cinco|diez|quince|veintidós|72)\s+(?:días?(?:\s+(?:hábiles|naturales))?|mes(?:es)?|años?|horas?)|mayoría\s+(?:absoluta|simple|cualificada|de\s+\d+\/\d+|\d+\/\d+)/i);
      if (timeM && plazosRows.length < 10) {
        const organ = s.match(/(?:Tribunal Constitucional|Cortes Generales|Congreso|Senado|Defensor del Pueblo|Consejo de Ministros|Gobierno|Administración|autoridad judicial|juez|tribunal|superior jerárquico|órgano competente)/i)?.[0] || 'Órgano competente';
        let subject = s.replace(/^[-\d.*•\s]+/, '').split(/[:.]/)[0].slice(0, 42).trim() || 'Trámite de examen';
        let detail = s.match(/(?:plazo|máximo|mínimo|requisito|trampa|prohib|excep|salvo|previa|ante|efecto|garantía|supervisa)[^.;]*/i)?.[0] || s.slice(0, 85);
        plazosRows.push([subject, timeM[0], organ, detail]);
      }
    }

    // 2. Table: Artículos y Preceptos Legales Clave
    const artRows = [];
    const seenArts = new Set();
    const artRegex = /\b(Arts?(?:[íi]culos?|\.)?\s*\d+(?:\s*(?:al?|y|-)\s*\d+)?(?:\s*(?:CE|LPAC|LCSP|LRJSP|TREBEP|LGP))?)\b/gi;
    for (const line of lines) {
      const matches = [...line.matchAll(artRegex)];
      for (const m of matches) {
        const art = m[1].trim();
        const normKey = art.toLowerCase().replace(/^(?:arts?\.?|art[íi]culos?)\s*/i, 'art. ').replace(/\s*(?:ce|lpac|lcsp|lrjsp|trebep|lgp)\b/i, '').trim();
        if (seenArts.has(normKey)) continue;
        seenArts.add(normKey);
        let desc = line.replace(m[0], '').replace(/^[:\-–.\s()]+/, '').replace(/[:\-–.\s()]+$/, '').trim();
        if (!desc || desc.length < 5) desc = line;
        const warning = line.match(/(?:amparo|recurso|plazo|mayoría|excep|salvo|prohib|esencial|reserva|tutela|preferente y sumario)[^.;]*/i)?.[0] || 'Dato literal de examen';
        artRows.push([art, desc.slice(0, 50), desc.slice(0, 110), warning]);
        if (artRows.length >= 10) break;
      }
    }

    // 3. Table: Órganos y Competencias Clave
    const organRows = [];
    const organRegex = /(?:Tribunal Constitucional|Cortes Generales|Congreso|Senado|Defensor del Pueblo|Consejo de Ministros|Gobierno|Ministro|Secretar(?:io|ía) de Estado|Subsecretar(?:io|ía)|Director General|Junta|Comisión|Delegado del Gobierno|Alcalde|Presidente)/i;
    for (const s of sents) {
      const orgM = s.match(organRegex);
      if (orgM && organRows.length < 8) {
        const orgName = orgM[0];
        const func = s.replace(orgName, '').replace(/^[:\-–.\s()]+/, '').trim().slice(0, 90) || 'Competencia legal atribuida';
        const nivel = /Constitucional|Cortes|Congreso|Senado|Gobierno|Ministro|Consejo/i.test(orgName) ? 'Órgano Superior / Constitucional' : 'Órgano Directivo / Administrativo';
        const via = /fin de la vía|agota la vía|recurso|alzada|reposición|contencioso/i.test(s) ? (s.match(/(?:fin de la vía|agota la vía|alzada|reposición|contencioso)[^.;]*/i)?.[0] || 'Vía administrativa') : 'Resolución administrativa';
        organRows.push([orgName, nivel, func, via]);
      }
    }

    // 4. Table: Garantías, Procedimiento y Recursos
    const procRows = [];
    for (const s of sents) {
      if (/recurso|alzada|reposición|revisión|amparo|silencio|nulidad|anulabilidad|caducidad|prescripción/i.test(s) && procRows.length < 8) {
        const term = s.match(/(?:recurso\s+(?:de\s+alzada|potestativo\s+de\s+reposición|extraordinario\s+de\s+revisión|de\s+amparo)|silencio\s+(?:administrativo|positivo|negativo)|nulidad\s+de\s+pleno\s+derecho|anulabilidad|caducidad|prescripción)/i)?.[0] || s.split(/[:.]/)[0].slice(0, 35);
        const tipo = /recurso/i.test(term) ? 'Vía de Impugnación' : /silencio/i.test(term) ? 'Efecto del Procedimiento' : 'Régimen de Invalidez';
        const plazo = s.match(/(?:\d+|un|una|dos|tres)\s+(?:mes(?:es)?|días?)|inmediato|en cualquier momento/i)?.[0] || 'Según ley reguladora';
        const efecto = s.match(/(?:pone fin|agota|desestimatori[oa]|estimatori[oa]|extingue|imprescriptible|subsanable)[^.;]*/i)?.[0] || s.slice(0, 80);
        procRows.push([term, tipo, plazo, efecto]);
      }
    }

    const tables = [];
    if (plazosRows.length) {
      tables.push({
        title: 'Cuadro 1: Matriz de Plazos, Términos y Quórums de Examen (' + t.title.slice(0, 40) + ')',
        heads: ['Trámite / Precepto', 'Plazo o Mayoría', 'Órgano Competente', 'Regla de Examen / Trampa'],
        widths: [0.24, 0.22, 0.26, 0.28],
        rows: plazosRows
      });
    }
    if (artRows.length) {
      tables.push({
        title: 'Cuadro 2: Preceptos y Artículos Legales Clave de Cita Obligatoria',
        heads: ['Precepto Legal', 'Materia Regulada', 'Contenido Esencial', 'Ojo al Tribunal'],
        widths: [0.18, 0.24, 0.32, 0.26],
        rows: artRows
      });
    }
    if (organRows.length) {
      tables.push({
        title: 'Cuadro 3: Órganos, Competencias y Procedimientos',
        heads: ['Órgano o Sujeto', 'Rango / Nivel', 'Competencia Clave', 'Régimen de Actos / Vía'],
        widths: [0.22, 0.22, 0.32, 0.24],
        rows: organRows
      });
    }
    if (procRows.length) {
      tables.push({
        title: 'Cuadro 4: Garantías, Procedimiento y Régimen de Recursos',
        heads: ['Figura / Mecanismo', 'Naturaleza', 'Plazo o Requisito', 'Efecto Jurídico'],
        widths: [0.26, 0.22, 0.24, 0.28],
        rows: procRows
      });
    }

    // Fallback if no specific regex matched: create synthesis table from top sentences
    if (!tables.length && sents.length) {
      tables.push({
        title: 'Cuadro Comparativo: Síntesis Estructurada de ' + t.title.slice(0, 40),
        heads: ['Aspecto / Precepto', 'Contenido Clave', 'Detalle Procedimental', 'Criterio de Examen'],
        widths: [0.25, 0.30, 0.25, 0.20],
        rows: sents.slice(0, 8).map((s, i) => [
          s.split(/[:.]/)[0].slice(0, 30) || ('Punto ' + (i + 1)),
          s.slice(0, 75),
          s.length > 75 ? s.slice(75, 150) : 'Precepto literal del temario',
          'Pregunta tipo test'
        ])
      });
    }

    return tables;
  }

  function downloadWordDoc(t, tab) {
    const title = t.title || 'Tema';
    const content = tab === 'table' ? generateCuadrosHTML(t) : tab === 'summary' ? generateExecutiveSummaryHTML(t) : generateBracketTreeHTML(t);
    const html = `
      <html xmlns:o='urn:schemas-microsoft-com:office:office' xmlns:w='urn:schemas-microsoft-com:office:word' xmlns='http://www.w3.org/TR/REC-html40'>
      <head><meta charset='utf-8'><title>${title}</title>
      <style>
        body { font-family: 'Segoe UI', Arial, sans-serif; margin: 30px; color: #222; }
        h1 { color: #553396; font-size: 20pt; }
        h2, h3 { color: #3b2a59; }
        table { border-collapse: collapse; width: 100%; margin: 16px 0; }
        th, td { border: 1px solid #ccc; padding: 8px 12px; font-size: 10pt; }
        th { background: #f0eef9; color: #553396; }
        .tag, .badge { background: #eee; padding: 2px 6px; border-radius: 4px; font-size: 9pt; }
        .badge-trampa { background: #fee2e2; color: #991b1b; }
        .badge-mayoria { background: #f3e8ff; color: #6b21a8; }
        .badge-plazo { background: #fef3c7; color: #92400e; }
        .badge-norma { background: #e0f2fe; color: #075985; }
      </style>
      </head>
      <body>
        <h1>${esc(title)} - Mi Cuaderno de Oposiciones</h1>
        <p><em>${esc(opp().short || 'GACE A2')} · ${tab === 'table' ? 'Cuadros y Tablas Oficiales' : tab === 'summary' ? 'Resumen Anti-Paja' : 'Esquema de Repaso'}</em></p>
        <hr>
        ${content}
      </body>
      </html>
    `;
    const blob = new Blob([html], { type: 'application/msword;charset=utf-8' });
    download(blob, `Mi_Cuaderno-${title.slice(0, 30).replace(/[^a-zA-Z0-9]/g, '_')}_${tab}.doc`);
    toast('Documento Word descargado.');
  }

  function renderMediaBar(t) {
    const assets = t.assets || [];
    const audios = assets.filter(a => a.type === 'audio' || /\.(mp3|m4a|wav|ogg|aac|flac)$/i.test(a.name));
    const videos = assets.filter(a => a.type === 'video' || /\.(mp4|webm|mov|mkv)$/i.test(a.name));
    const slides = assets.filter(a => a.type === 'slides' || /\.(pptx|ppt|odp)$/i.test(a.name));

    if (!audios.length && !videos.length && !slides.length) return '';

    return `
      <div class="media-card stack" style="gap:10px">
        <div class="row between">
          <strong style="color:var(--deep);font-size:13px">🎵 Materiales Multimedia del Tema</strong>
          <span class="tag" style="background:#f0eef9;color:#553396;font-size:10px">${audios.length + videos.length + slides.length} adjuntos</span>
        </div>
        ${audios.map(a => `
          <div style="background:#fff;padding:8px 12px;border-radius:8px;border:1px solid var(--line)">
            <div class="row between small" style="margin-bottom:6px">
              <span>🎧 <strong>Audio de clase / voz:</strong> ${esc(a.name)}</span>
              <div class="row" style="gap:6px">
                <label class="row tiny muted">Velocidad <select onchange="this.closest('div').parentElement.parentElement.querySelector('audio').playbackRate = +this.value" style="padding:1px 4px;font-size:10px"><option value="1">1x</option><option value="1.25">1.25x</option><option value="1.5">1.5x</option><option value="2">2x</option></select></label>
                <button class="btn sm soft" onclick="downloadAsset('${esc(a.id)}', '${esc(a.name)}')" title="Descargar archivo de audio" style="padding:1px 6px;font-size:10px">${I('download', 10)} Guardar</button>
              </div>
            </div>
            <audio controls preload="metadata" style="width:100%;height:32px" id="audio-${esc(a.id)}"></audio>
          </div>
        `).join('')}
        ${videos.map(v => `
          <div style="background:#fff;padding:8px 12px;border-radius:8px;border:1px solid var(--line)">
            <div class="row between small" style="margin-bottom:6px">
              <span>🎬 <strong>Vídeo explicativo:</strong> ${esc(v.name)}</span>
              <button class="btn sm soft" onclick="downloadAsset('${esc(v.id)}', '${esc(v.name)}')" style="padding:1px 6px;font-size:10px">${I('download', 10)} Descargar Vídeo</button>
            </div>
            <video controls preload="metadata" style="width:100%;max-height:220px;border-radius:6px;background:#000" id="video-${esc(v.id)}"></video>
          </div>
        `).join('')}
        ${slides.map(s => `
          <div class="row between" style="background:#fff;padding:8px 12px;border-radius:8px;border:1px solid var(--line);font-size:12px">
            <span>📊 <strong>Diapositivas PowerPoint:</strong> ${esc(s.name)}</span>
            <button class="btn sm soft" onclick="downloadAsset('${esc(s.id)}', '${esc(s.name)}')">${I('download', 12)} Descargar PPTX</button>
          </div>
        `).join('')}
      </div>
    `;
  }

  function reader(id, schemes = false) {
    const t = topic(id) || currentTopic();
    if (!t) return `<div class="page">${heading('Mis esquemas', 'Convierte tus apuntes en un repaso estructurado y visual.')}<div class="surface empty-state">${I('book', 30)}<h3>Empieza con un tema</h3><p>Importa tus apuntes para generar tu primer esquema.</p>${btn('Importar apuntes', 'import', 'upload', 'primary')}</div></div>`;
    opp().lastTopic = t.id;
    const pdfs = (t.assets || []).filter(a => a.pdf || /\.pdf$/i.test(a.name));
    const isPdf = sourceTab === 'pdf' && pdfs.length;
    const empty = `<div class="empty-state">${I('file', 27)}<h3>Aún no hay apuntes en este tema</h3><p>Sube un documento, PDFs, audios o pega tus apuntes para activar el cuaderno.</p><button class="btn soft" data-act="import" data-id="${esc(t.id)}">${I('upload', 15)}Importar apuntes o audios</button></div>`;

    return `
      <div class="page font-mode-${currentFontMode}">
        <button class="bread" data-go="library">${I('back', 13)} Volver al temario</button>
        ${heading(schemes ? 'Esquemas y Cuadros de Estudio' : t.title, schemes ? 'Tu texto oficial y sus ideas esenciales en esquema de llaves, cuadros y resumen.' : (opp().blocks[t.b] || 'Temario') + ' · ' + t.rounds + ' vueltas de estudio', `
          <div class="row" style="gap:6px">
            ${btn('Importar apuntes / audio', 'import', 'upload', 'sm')}
            ${btn('Marcar vuelta', 'reviewed', 'check', 'primary', 'sm')}
          </div>
        `, (opp().short || 'GACE A2') + ' / Bloque ' + ((t.b || 0) + 1))}

        ${schemes ? `
          <label class="field" style="margin-bottom:17px"><span>Tema seleccionado</span>
            <select id="scheme-topic">
              ${opp().topics.map(x => `<option value="${esc(x.id)}" ${x.id === t.id ? 'selected' : ''}>${esc(x.title)}${x.text ? '' : ' · sin apuntes'}</option>`).join('')}
            </select>
          </label>
        ` : ''}

        <div class="split-reader">
          <!-- COLUMNA IZQUIERDA: DOCUMENTO ORIGINAL / VISOR / AUDIOS -->
          <section class="surface reader-col">
            <div class="reader-head">
              <div class="row" style="gap:8px">
                <h2>${I('book', 16)} Documento original</h2>
                <button class="icon-btn" data-act="edit-notes" title="Editar texto">${I('pen', 14)}</button>

              <!-- Barra de Subrayadores Pastel -->

                <span class="tiny muted">Subrayar:</span>

                <button class="icon-btn" onclick="activePastelColor='green';applyPastelHighlight();" title="Verde pastel" style="width:20px;height:20px;border-radius:50%;background:#bbf7d0;border:1.5px solid #86efac;padding:0"></button>

                <button class="icon-btn" onclick="activePastelColor='purple';applyPastelHighlight();" title="Lavanda pastel" style="width:20px;height:20px;border-radius:50%;background:#e9d5ff;border:1.5px solid #c084fc;padding:0"></button>

  function testsView(){return `<div class="page">${heading('Tests de examen','Diseña un simulacro y aprende de cada respuesta.',btn('Generar preguntas con IA','ai-questions','sparkle'),'Práctica / '+opp().short)}<div class="content-grid"><section class="surface workspace"><h2 class="panel-title">Configura tu examen</h2>${state.exam?.opp===opp().id?`<div class="notice between" style="margin-bottom:17px"><span>Tienes un examen en curso.</span><button class="btn sm" data-go="quiz">Continuar ${I('arrow',12)}</button></div>`:''}<form id="test-form" class="stack"><div class="field"><span>Número de preguntas</span><div class="choice-grid">${[10,15,20,30].map(n=>`<label><input type="radio" name="count" value="${n}" ${n===10?'checked':''}>${n}</label>`).join('')}</div></div><label class="field"><span>Contenido del examen</span><select name="scope" id="test-scope">${[['all','Todo mi temario'],['block','Un bloque temático'],['topic','Un tema concreto'],['failed','Mis preguntas falladas']].map(([v,l])=>`<option value="${v}" ${testScope===v?'selected':''}>${l}</option>`).join('')}</select></label><label class="field" id="test-block-field" ${testScope==='block'?'':'hidden'}><span>Bloque</span><select name="block">${opp().blocks.map((b,i)=>`<option value="${i}" ${i===Number(testBlock)?'selected':''}>${esc(b)}</option>`).join('')}</select></label><label class="field" id="test-topic-field" ${testScope==='topic'?'':'hidden'}><span>Tema</span><select name="topic">${opp().topics.map(t=>`<option value="${esc(t.id)}" ${t.id===(testTopic||currentTopic()?.id)?'selected':''}>${esc(t.title)}</option>`).join('')}</select></label><label class="field"><span>Penalización por respuesta incorrecta</span><select name="penalty" id="test-penalty"><option value="0">Sin penalización</option><option value="0.25">1/4 de un acierto</option><option value="${1/3}" selected>1/3 de un acierto · habitual en AGE</option><option value="0.5">1/2 de un acierto</option><option value="manual">Personalizada</option><   function balancedQuestions(qs){const offset=Math.floor(Math.random()*4),keys=shuffle(qs.map((_,i)=>(i+offset)%4));return qs.map((q,i)=>{const idx=keys[i],correct=q.a[q.c],wrong=shuffle(q.a.map((v,j)=>({v,j})).filter(x=>x.j!==q.c));wrong.splice(idx,0,{v:correct,j:q.c});return {...q,a:wrong.map(x=>x.v),c:idx,exps:wrong.map(x=>x.j===q.c?q.why:q.exps?.[x.j]||q.traps?.[x.j>q.c?x.j-1:x.j]||`«${x.v}» no satisface la regla aplicable. ${q.why}`)}})}

  function adjustMistake(q,right){const k=opp().id+':'+q.id;if(right){if(state.mistakes[k])state.mistakes[k].count=Math.max(0,state.mistakes[k].count-1)}else{state.mistakes[k]={question:q,count:(state.mistakes[k]?.count||0)+1,at:Date.now()}}const t=topic(q.t);if(t)t.errors=Math.max(0,t.errors+(right?-1:1))}

  const caseLibrary=[{title:'Una solicitud por subsanar',block:'Procedimiento administrativo común',file:'PAC / 024',facts:'La asociación La Encina presenta electrónicamente una solicitud de autorización. Falta un documento preceptivo. El órgano instructor notifica un requerimiento de subsanación. La notificación se recibe un martes no festivo. La resolución posterior no pone fin a la vía administrativa.',docs:['Solicitud registrada y acreditación de la asociación.','Requerimiento electrónico de subsanación.','Resolución expresa con indicación de recursos.'],ids:[12,13,14,15,16,17],solution:'La asociación dispone de diez días hábiles para subsanar, contados desde el día siguiente a la notificación (arts. 68.1 y 30.2-3 de la Ley 39/2015). Si no subsana, procede el desistimiento previa resolución, no la caducidad automática. Frente al acto expreso que no agota la vía administrativa cabe alzada ante el superior jerárquico en un mes (arts. 121.1 y 122.1).'},
  {title:'El mantenimiento de la biblioteca',block:'Contratación pública',file:'CON / 018',facts:'Una biblioteca municipal necesita un servicio puntual de catalogación. El valor estimado asciende a 12.400 euros, sin IVA. Se prevé una duración de ocho meses, sin prestaciones sucesivas ni fraccionamiento. La unidad propone tramitar un contrato menor y añadir una prórroga de seis meses.',docs:['Memoria justificativa de la necesidad.','Presupuesto por 12.400 euros más IVA.','Propuesta de contrato y de prórroga.'],ids:[24,26,27,28,29],solution:'El valor estimado, calculado sin IVA, es inferior a 15.000 euros (arts. 101.1 y 118.1 LCSP). Deben justificarse la necesidad y la ausencia de alteración del objeto, aprobarse el gasto e incorporarse la factura (art. 118.2-3). La prórroga propuesta no es admisible: un contrato menor no puede prorrogarse ni exceder de un año (art. 29.8).'},

  function speakCaseFacts(text) {
    if (!('speechSynthesis' in window)) return toast('Síntesis de voz no disponible en este navegador.');
    window.speechSynthesis.cancel();
    if (!text) return;
    const u = new SpeechSynthesisUtterance(text);
    u.lang = 'es-ES';
    u.rate = 0.95;
    window.speechSynthesis.speak(u);
    toast('🔊 Leyendo en voz alta...');
  }

  function stopSpeechSynthesis() {
    if ('speechSynthesis' in window) {
      window.speechSynthesis.cancel();
      toast('Audio detenido.');
    }
  }

  function toggleOralRecognition() {
    const SpeechAPI = window.SpeechRecognition || window.webkitSpeechRecognition;
    if (!SpeechAPI) {
      toast('Tu navegador no soporta dictado por voz (Web Speech API). Prueba en Google Chrome o Edge.');
      return;
    }
    if (isListeningOral) {
      if (speechRecognizer) speechRecognizer.stop();
      isListeningOral = false;
      renderRoute(false);
      toast('Dictado en pausa.');
      return;
    }
    speechRecognizer = new SpeechAPI();
    speechRecognizer.lang = 'es-ES';
    speechRecognizer.continuous = true;
    speechRecognizer.interimResults = true;
    speechRecognizer.onstart = () => {
      isListeningOral = true;
      renderRoute(false);
      toast('🎙️ Micrófono activado. Habla con claridad al tribunal...');
    };
    speechRecognizer.onresult = (e) => {
      let interim = '';
      for (let i = e.resultIndex; i < e.results.length; ++i) {
        if (e.results[i].isFinal) {
          oralTranscript += ' ' + e.results[i][0].transcript;
        } else {
          interim += e.results[i][0].transcript;
        }
      }
      const el = document.getElementById('oral-transcription-live');
      if (el) el.innerHTML = '<strong>Transcripción en vivo:</strong> ' + esc(oralTranscript) + ' <i style="color:var(--muted)">' + esc(interim) + '</i>';
    };
    speechRecognizer.onerror = (e) => {
      isListeningOral = false;
      renderRoute(false);
      toast('Aviso del micrófono: ' + (e.error || 'comprueba permisos de audio'));
    };
    speechRecognizer.onend = () => {
      isListeningOral = false;
      renderRoute(false);
    };
    speechRecognizer.start();
  }

      version: 3,
      name: name || 'Opositor',
      pin: String(pin || '').trim(),
      active: oppChoice,
      opps: [makeTemplateGACE(), makeTemplateC1()],
      goal: 120,
      session: 0,
      days: {},
      pet: { name: 'OpoPet', personality: 'Motivadora', prompt: 'Un border collie con toga', image: '' },
      savedPets: [...defaultSavedPets],
      history: [],
      mistakes: {},
      srs: {},
      records: {},
      recent: [],
      exam: null,
      model: 'gpt-4o-mini',
      demo: false
    };
    // Ensure all 58 topics start with exactly 0 rounds and official template notes
    s.opps.forEach(o => {
      o.topics.forEach((t, i) => {
        t.rounds = 0;
        t.errors = 0;
        t.assets = [];
        if (i === 0) t.text = officialAcademyNotes.t1;
        else if (i === 1) t.text = officialAcademyNotes.t2;
        else t.text = '';
      });
    });
    return s;
  }

  function switchProfile(name) {
    if (!name) return;
    const list = getProfilesList();
    const entry = list.find(p => (typeof p === 'string' ? p : p.name) === name);
    const pinRequired = entry && typeof entry === 'object' && entry.pin;

    if (pinRequired) {
      const inputPin = prompt('Introduce el PIN o contraseña de acceso de «' + name + '»:');
      if (inputPin === null) return;
      if (String(inputPin).trim() !== String(entry.pin).trim()) {
        toast('❌ PIN o contraseña incorrecta. Acceso denegado.');
        return;
      }
    }

    save();
    localStorage.setItem(ACTIVE_USER_KEY, name);
    const raw = localStorage.getItem(getUserStorageKey(name));
    if (raw) {
      try {
        state = JSON.parse(raw);
      } catch(e) {
        state = cleanUserState(name);
      }
    } else {
      state = cleanUserState(name, entry && typeof entry === 'object' ? entry.pin : '');
      localStorage.setItem(getUserStorageKey(name), JSON.stringify(state));
    }
    resetContext();
    save();
    renderRoute(false);
    toast('Sesión iniciada con éxito: ' + name);
  }

  function createNewProfile(name, pin = '', oppChoice = 'gace-a2') {
    const cleanName = String(name || '').trim();
    if (!cleanName) throw Error('Introduce un nombre para tu perfil.');
    const list = getProfilesList();
    if (list.some(p => (typeof p === 'string' ? p : p.name).toLowerCase() === cleanName.toLowerCase())) {
      throw Error('Ya existe un perfil con ese nombre.');
    }
    list.push({ name: cleanName, pin: String(pin).trim() });
    localStorage.setItem(PROFILES_KEY, JSON.stringify(list));
    
    // Create 100% clean state for new user
    const newState = cleanUserState(cleanName, pin, oppChoice);
    localStorage.setItem(getUserStorageKey(cleanName), JSON.stringify(newState));
    localStorage.setItem(ACTIVE_USER_KEY, cleanName);
    state = newState;
    resetContext();
    save();
    renderRoute(false);
    toast('¡Perfil «' + cleanName + '» creado con éxito y 100% limpio!');
  }

  function deleteProfile(name) {
    const list = getProfilesList();
    if (list.length <= 1) throw Error('Debe quedar al menos un perfil activo.');
    const filtered = list.filter(p => (typeof p === 'string' ? p : p.name) !== name);
    localStorage.setItem(PROFILES_KEY, JSON.stringify(filtered));
    localStorage.removeItem(getUserStorageKey(name));
    if (currentUserName() === name) {
      const next = typeof filtered[0] === 'string' ? filtered[0] : filtered[0].name;
      switchProfile(next);
    } else {
      renderRoute(false);
    }
    toast('Perfil «' + name + '» eliminado.');
  }

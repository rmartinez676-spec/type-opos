  /* =================================================================
     OPONEXUS: 8-BIT RETRO SOUND FX ENGINE (WEB AUDIO API)
     ================================================================= */
  let retroSoundEnabled = true;
  let audioCtx = null;
  function getAudioContext() {
    if (!audioCtx) {
      const AC = window.AudioContext || window.webkitAudioContext;
      if (AC) audioCtx = new AC();
    }
    if (audioCtx && audioCtx.state === 'suspended') {
      audioCtx.resume();
    }
    return audioCtx;
  }

  function playRetroSound(kind) {
    if (!retroSoundEnabled) return;
    try {
      const ctx = getAudioContext();
      if (!ctx) return;
      const t = ctx.currentTime;
      if (kind === 'beep') {
        const osc = ctx.createOscillator();
        const g = ctx.createGain();
        osc.type = 'square';
        osc.frequency.setValueAtTime(880, t);
        osc.frequency.setValueAtTime(1174.66, t + 0.05);
        g.gain.setValueAtTime(0.08, t);
        g.gain.exponentialRampToValueAtTime(0.001, t + 0.12);
        osc.connect(g);
        g.connect(ctx.destination);
        osc.start(t);
        osc.stop(t + 0.13);
      } else if (kind === 'punch') {
        const osc = ctx.createOscillator();
        const g = ctx.createGain();
        osc.type = 'sawtooth';
        osc.frequency.setValueAtTime(180, t);
        osc.frequency.exponentialRampToValueAtTime(40, t + 0.15);
        g.gain.setValueAtTime(0.18, t);
        g.gain.exponentialRampToValueAtTime(0.001, t + 0.16);
        osc.connect(g);
        g.connect(ctx.destination);
        osc.start(t);
        osc.stop(t + 0.17);
      } else if (kind === 'victory') {
        const notes = [523.25, 659.25, 783.99, 1046.50]; // C5, E5, G5, C6
        notes.forEach((freq, idx) => {
          const osc = ctx.createOscillator();
          const g = ctx.createGain();
          osc.type = 'triangle';
          osc.frequency.setValueAtTime(freq, t + idx * 0.1);
          g.gain.setValueAtTime(0.12, t + idx * 0.1);
          g.gain.exponentialRampToValueAtTime(0.001, t + idx * 0.1 + 0.25);
          osc.connect(g);
          g.connect(ctx.destination);
          osc.start(t + idx * 0.1);
          osc.stop(t + idx * 0.1 + 0.26);
        });
      } else if (kind === 'defeat') {
        const notes = [392.00, 311.13, 261.63]; // G4, Eb4, C4
        notes.forEach((freq, idx) => {
          const osc = ctx.createOscillator();
          const g = ctx.createGain();
          osc.type = 'sawtooth';
          osc.frequency.setValueAtTime(freq, t + idx * 0.15);
          g.gain.setValueAtTime(0.1, t + idx * 0.15);
          g.gain.exponentialRampToValueAtTime(0.001, t + idx * 0.15 + 0.28);
          osc.connect(g);
          g.connect(ctx.destination);
          osc.start(t + idx * 0.15);
          osc.stop(t + idx * 0.15 + 0.3);
        });
      }
    } catch(e) {}
  }

  /* =================================================================
     OPONEXUS: POMODORO SOUND STUDIO (WHITE NOISE, RAIN & LO-FI JAZZ)
     ================================================================= */
  let pomoAmbientMode = 'none'; // 'none', 'white_noise', 'rain', 'lofi_jazz'
  let pomoAmbientNodes = null;

  function stopPomoAmbient() {
    if (pomoAmbientNodes) {
      try {
        if (pomoAmbientNodes.source) pomoAmbientNodes.source.stop();
        if (pomoAmbientNodes.timer) clearInterval(pomoAmbientNodes.timer);
      } catch(e) {}
      pomoAmbientNodes = null;
    }
  }

  function startPomoAmbient(mode) {
    stopPomoAmbient();
    pomoAmbientMode = mode;
    if (mode === 'none') return;
    try {
      const ctx = getAudioContext();
      if (!ctx) return;
      if (mode === 'white_noise' || mode === 'rain') {
        const bufferSize = ctx.sampleRate * 3;
        const buffer = ctx.createBuffer(1, bufferSize, ctx.sampleRate);
        const data = buffer.getChannelData(0);
        let lastOut = 0.0;
        for (let i = 0; i < bufferSize; i++) {
          const white = Math.random() * 2 - 1;
          if (mode === 'rain') {
            lastOut = (lastOut + (0.02 * white)) / 1.02; // Brown/pink filter
            data[i] = lastOut * 3.5;
          } else {
            data[i] = white * 0.2; // Soft white
          }
        }
        const source = ctx.createBufferSource();
        source.buffer = buffer;
        source.loop = true;
        const filter = ctx.createBiquadFilter();
        filter.type = 'lowpass';
        filter.frequency.value = mode === 'rain' ? 800 : 3000;
        const gain = ctx.createGain();
        gain.gain.value = 0.06;
        source.connect(filter);
        filter.connect(gain);
        gain.connect(ctx.destination);
        source.start();
        pomoAmbientNodes = { source, gain };
      } else if (mode === 'lofi_jazz') {
        // Synthesize periodic warm Rhodes maj7 / m7 chords
        const chords = [
          [261.63, 329.63, 392.00, 493.88], // Cmaj7
          [220.00, 261.63, 329.63, 392.00], // Am7
          [293.66, 349.23, 440.00, 523.25], // Dm7
          [196.00, 246.94, 293.66, 349.23]  // G7
        ];
        let chordIdx = 0;
        const playChord = () => {
          if (!pomoRunning) return;
          const notes = chords[chordIdx % chords.length];
          chordIdx++;
          const t = ctx.currentTime;
          notes.forEach(f => {
            const osc = ctx.createOscillator();
            const g = ctx.createGain();
            osc.type = 'sine';
            osc.frequency.setValueAtTime(f, t);
            g.gain.setValueAtTime(0.015, t);
            g.gain.exponentialRampToValueAtTime(0.0001, t + 4.2);
            osc.connect(g);
            g.connect(ctx.destination);
            osc.start(t);
            osc.stop(t + 4.3);
          });
        };
        playChord();
        const timer = setInterval(playChord, 5000);
        pomoAmbientNodes = { timer };
      }
    } catch(e) {}
  }

  function playPomoChime() {
    if (!pomoSoundEnabled) return;
    try {
      const AudioCtx = window.AudioContext || window.webkitAudioContext;
      if (!AudioCtx) return;
      const ctx = new AudioCtx();
      const osc = ctx.createOscillator();
      const gain = ctx.createGain();
      osc.connect(gain);
      gain.connect(ctx.destination);
      osc.type = 'sine';
      osc.frequency.setValueAtTime(523.25, ctx.currentTime);
      osc.frequency.setValueAtTime(659.25, ctx.currentTime + 0.15);
      osc.frequency.setValueAtTime(783.99, ctx.currentTime + 0.30);
      gain.gain.setValueAtTime(0.20, ctx.currentTime);
      gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 0.90);
      osc.start();
      osc.stop(ctx.currentTime + 0.95);
    } catch(e) {}
  }

  function renderFloatingPet() {
    let container = document.getElementById('floating-pet-widget');
    if (!container) {
      container = document.createElement('div');
      container.id = 'floating-pet-widget';
      container.className = 'floating-pet-container';
      document.body.appendChild(container);
      
      // Load saved coordinates if valid and inside viewport
      try {
        const saved = JSON.parse(localStorage.getItem('opocuaderno_mascot_coords'));
        if (saved && saved.x >= 10 && saved.x <= window.innerWidth - 75 && saved.y >= 10 && saved.y <= window.innerHeight - 75) {
          container.style.right = 'auto';
          container.style.bottom = 'auto';
          container.style.left = saved.x + 'px';
          container.style.top = saved.y + 'px';
        }
      } catch(e) {}

      // Safe, bounded dragging with distance threshold
      let isDragging = false, startX, startY, origX, origY, moved = false;

      const onPointerDown = (e) => {
        if (e.target.closest('#floating-pet-dialog') || e.target.closest('.pet-pomo-badge') || e.target.closest('button')) return;
        startX = e.clientX;
        startY = e.clientY;
        const rect = container.getBoundingClientRect();
        origX = rect.left;
        origY = rect.top;
        moved = false;
        isDragging = true;
        window.addEventListener('pointermove', onPointerMove);
        window.addEventListener('pointerup', onPointerUp);
      };

      const onPointerMove = (e) => {
        if (!isDragging) return;
        const dx = e.clientX - startX;
        const dy = e.clientY - startY;
        if (!moved && Math.hypot(dx, dy) < 8) return; // Ignore micro-jitters
        moved = true;
        container.style.right = 'auto';
        container.style.bottom = 'auto';
        const w = window.innerWidth, h = window.innerHeight;
        const safeX = Math.max(12, Math.min(w - 75, origX + dx));
        const safeY = Math.max(12, Math.min(h - 75, origY + dy));
        container.style.left = safeX + 'px';
        container.style.top = safeY + 'px';
      };

      const onPointerUp = () => {
        if (isDragging && moved) {
          try {
            const rect = container.getBoundingClientRect();
            localStorage.setItem('opocuaderno_mascot_coords', JSON.stringify({ x: rect.left, y: rect.top }));
          } catch(e) {}
        }
        isDragging = false;
        window.removeEventListener('pointermove', onPointerMove);
        window.removeEventListener('pointerup', onPointerUp);
      };

      container.addEventListener('pointerdown', onPointerDown);
      // Double click safely resets position
      container.addEventListener('dblclick', resetMascotPosition);
    }

    container.innerHTML = `
      <!-- Relojito Pomodoro en la mascota -->

  function formatLeafContent(s) {
    let out = esc(s);
    out = out.replace(/\[TRAMPA(?::\s*([^\]]+))?\]/gi, (m, g1) => '<span class="badge-trampa">🔴 TRAMPA TRIBUNAL</span> ' + (g1 ? '<strong>' + g1.trim() + '</strong>' : ''));
    out = out.replace(/\[MAYORÍA(?::\s*([^\]]+))?\]/gi, (m, g1) => '<span class="badge-mayoria">🟣 MAYORÍA</span> ' + (g1 ? '<strong>' + g1.trim() + '</strong>' : ''));
    out = out.replace(/\[PLAZO(?::\s*([^\]]+))?\]/gi, (m, g1) => '<span class="badge-plazo">⏱️ PLAZO</span> ' + (g1 ? '<strong>' + g1.trim() + '</strong>' : ''));
    out = out.replace(/\[LEY(?::\s*([^\]]+))?\]/gi, (m, g1) => '<span class="badge-norma">📜 LEY APLICABLE</span> ' + (g1 ? '<strong>' + g1.trim() + '</strong>' : ''));
    return highlight(out);
  }

  function buildDynamicNovolexTree(t) {
    if (!t) return null;
    const raw = String(t.text || '').trim();
    const lines = raw.split(/\n+/).map(l => l.trim()).filter(l => l.length > 2);

    const sections = [];
    let curSec = null;

    for (const line of lines) {
      const isHeading = /^(?:[I|V|X]+\.|\d+(?:\.\d+)*[.)\s]|TEMA\s+\d+|TÍTULO\s+[IVX\d]+|CAPÍTULO\s+[IVX\d]+|SECCIÓN\s+[IVX\d]+|[A-ZÁÉÍÓÚ\s]{5,}:?)/i.test(line) && line.length < 100;
      if (isHeading) {
        if (curSec && (curSec.items.length || curSec.title)) sections.push(curSec);
        const cleanTitle = line.replace(/^[-*•\s]+/, '').replace(/^(?:[I|V|X]+\.|\d+(?:\.\d+)*[.)\s]|TEMA\s+\d+|TÍTULO\s+[IVX\d]+|CAPÍTULO\s+[IVX\d]+|SECCIÓN\s+[IVX\d]+)\s*/i, '').trim();
        curSec = { title: cleanTitle || line, items: [] };
      } else {
        if (!curSec) curSec = { title: 'Marco Conceptual y Fundamentos', items: [] };
        const cleanLine = line.replace(/^[-*•]\s*/, '').trim();
        if (cleanLine.length > 8) curSec.items.push(cleanLine);
      }
    }
    if (curSec && (curSec.items.length || curSec.title)) sections.push(curSec);

    if (!sections.length) {
      sections.push({
        title: 'Fundamentos y Regulación',
        items: lines.slice(0, 5)
      });
      if (lines.length > 5) {
        sections.push({
          title: 'Procedimiento, Plazos y Efectos',
          items: lines.slice(5, 12)
        });
      }
    }

    function tagItem(it) {
      let res = it;
      if (/\b(?:días?|mes(?:es)?|años?|horas?|plazo)\b/i.test(it) && !/\[PLAZO/i.test(it)) {
        const m = it.match(/(?:\d+|un|una|dos|tres|cuatro|cinco|diez|quince|veintidós|72)\s+(?:días?(?:\s+(?:hábiles|naturales))?|mes(?:es)?|años?|horas?)|plazo\s+(?:máximo|mínimo|general|improrrogable)/i);
        if (m) res = res.replace(m[0], `[PLAZO: ${m[0]}]`);
      }
      if (/\b(?:mayoría\s+(?:absoluta|simple|cualificada|de\s+\d+\/\d+|\d+\/\d+))\b/i.test(it) && !/\[MAYORÍA/i.test(it)) {
        const m = it.match(/mayoría\s+(?:absoluta|simple|cualificada|de\s+\d+\/\d+|\d+\/\d+)/i);
        if (m) res = res.replace(m[0], `[MAYORÍA: ${m[0]}]`);
      }
      if (/\b(?:ojo|trampa|en ningún caso|no podrá|no se podrá|prohibid[oa]|salvo|excepto)\b/i.test(it) && !/\[TRAMPA/i.test(it)) {
        const m = it.match(/(?:en ningún caso|no podrá|no se podrá|prohibid[oa]|salvo\s+[^,;.]+|excepto\s+[^,;.]+)/i);
        if (m) res = res.replace(m[0], `[TRAMPA: ${m[0]}]`);
      }
      if (/\b(?:ley orgánica|decreto-ley|reserva de ley)\b/i.test(it) && !/\[LEY/i.test(it)) {
        const m = it.match(/(?:ley orgánica|decreto-ley|reserva de ley)/i);
        if (m) res = res.replace(m[0], `[LEY: ${m[0]}]`);
      }
      return res;
    }

    const mid = Math.ceil(sections.length / 2);
    const part1Secs = sections.slice(0, mid);
    const part2Secs = sections.slice(mid);

    const tier1 = [
      {
        name: 'Marco Teórico y Normativo',
        category: 'PARTE I · DOGMÁTICA',
        subbranches: part1Secs.map(s => ({
          name: s.title.slice(0, 52),
          items: s.items.slice(0, 6).map(tagItem)
        }))
      }
    ];

    if (part2Secs.length) {
      tier1.push({
        name: 'Régimen Jurídico y Aplicación Práctica',
        category: 'PARTE II · PROCEDIMIENTO Y GARANTÍAS',
        subbranches: part2Secs.map(s => ({
          name: s.title.slice(0, 52),
          items: s.items.slice(0, 6).map(tagItem)
        }))
      });
    }

    return {
      title: t.title,
      metrics: sections.length + ' Secciones Analizadas · ' + (opp().short || 'GACE A2'),
      tier1
    };
  }

  function buildDynamicExecutiveSummary(t) {
    const raw = String(t.text || '').trim();
    if (!raw) {
      return `
        <div class="summary-container stack" style="gap:14px">
          <div class="notice row between" style="background:#fdf7e7;border-color:#f5e5ba;padding:14px 18px;border-radius:10px">
            <div>
              <strong>📖 Sin apuntes cargados para este tema</strong>

            </div>
            <div class="row" style="gap:8px">
              <button class="btn sm primary" data-act="import" data-id="${esc(t.id)}">Importar apuntes</button>
              <button class="btn sm soft" data-act="load-official-notes" data-id="${esc(t.id)}">Cargar apuntes oficiales</button>
            </div>
          </div>
        </div>
      `;
    }

    const sumLines = summarize(raw);
    const ideasFuerza = sumLines.length >= 3 ? sumLines.slice(0, 5) : [
      ...sentences(raw).filter(s => s.length > 25 && s.length < 180).slice(0, 4)
    ];

    const defs = glossary(raw);
    const keyArticles = [];
    const artMatches = raw.match(/(?:Art(?:ículo|\.)?\s*\d+(?:\.\d+)?(?:\s+(?:de la\s+)?(?:CE|LPAC|LRJSP|TREBEP|LCSP|LGP|Ley\s+[\d/]+))?[^.\n;]{10,120})/gi) || [];
    const seenArt = new Set();
    for (const m of artMatches) {
      const clean = m.trim().replace(/^[-*•\s]+/, '');
      const head = clean.split(/[:\-\—]/)[0].trim();
      if (!seenArt.has(head.toLowerCase()) && head.length < 40) {
        seenArt.add(head.toLowerCase());
        keyArticles.push({
          term: head,
          def: clean.slice(head.length).replace(/^[:\-\—\s]+/, '').trim() || clean
        });
        if (keyArticles.length >= 5) break;
      }
    }
    const combinedDefs = defs.length ? defs.slice(0, 5) : keyArticles;

    const deadlines = (raw.match(keyRX) || []).map(x => x.trim());
    const uniqueDeadlines = Array.from(new Set(deadlines.map(d => d.toLowerCase()))).slice(0, 5);
    const trapQuestions = [];
    if (uniqueDeadlines.length) {
      trapQuestions.push(`<strong>Plazos críticos detectados:</strong> ${uniqueDeadlines.map(d => `<span class="badge-plazo" style="background:#fee2e2;color:#991b1b;margin:2px 4px">${esc(d)}</span>`).join(' ')}`);
    }
    const exceptions = raw.match(/([^.\n;]+(?:no cabe|salvo|a excepción de|prohibid|exclusivament|preceptiv)[^.\n;]+)/gi) || [];
    for (const ex of exceptions.slice(0, 3)) {
      const cleanEx = ex.trim().replace(/^[-*•\s]+/, '');
      if (cleanEx.length > 20 && cleanEx.length < 200) {
        trapQuestions.push(`<strong>Regla / Excepción clave:</strong> ${highlight(cleanEx)}`);
      }
    }
    if (!trapQuestions.length) {
      trapQuestions.push('<strong>Atención al cómputo:</strong> Verificar si el plazo se fija en días hábiles (excluidos sábados, domingos y festivos) o naturales.');
      trapQuestions.push('<strong>Incompetencia u omisión de procedimiento:</strong> Causa nulidad de pleno derecho si es manifiesta.');
    }

    return `
      <div class="summary-container stack" style="gap:14px">
        <div class="notice row between" style="background:#fdf7e7;border-color:#f5e5ba;padding:12px 16px;border-radius:10px">
          <span>🎯 <strong>Resumen Anti-Paja ${isTopicSeguridadSocial(t) ? 'Oficial · Seguridad Social (RDL 8/2015)' : 'Dinámico'} · ${esc(t.title)}:</strong> Síntesis de alta fidelidad con los artículos, plazos y trampas más probables en el examen.</span>
          <button class="btn sm soft" data-act="regenerate-analysis" title="Reanalizar apuntes">${I('sparkle',12)} Actualizar</button>
        </div>

        <div class="surface" style="padding:16px;border:1px solid var(--line);border-radius:12px;">
          <h4 style="margin:0 0 10px 0;color:var(--deep)">1. Ideas Fuerza de Examen Extraídas</h4>
          <ul style="margin:0 0 16px 0;padding-left:20px;font-size:13px;line-height:1.7;color:#3b3534">
            ${ideasFuerza.length ? ideasFuerza.map(s => `<li>${highlight(s)}</li>`).join('') : `<li>Lectura y conceptos extraídos del temario para ${esc(t.title)}.</li>`}
          </ul>

          <h4 style="margin:16px 0 10px 0;color:var(--deep)">2. Artículos y Conceptos Clave de Cita Obligatoria</h4>
          <div class="stack" style="gap:8px">
            ${combinedDefs.length ? combinedDefs.map(d => `
              <div style="background:#faf8f5;padding:9px 12px;border-radius:8px;border-left:3px solid #75618e;">
                <strong style="color:#514064">${esc(d.term)}:</strong>
                <span style="font-size:13px">${highlight(d.def)}</span>
              </div>
            `).join('') : `
              <div style="background:#faf8f5;padding:9px 12px;border-radius:8px;border-left:3px solid #75618e;">
                <span style="font-size:13px">Revisa los artículos normativos citados en los apuntes del tema.</span>
              </div>
            `}
          </div>

          <h4 style="margin:18px 0 10px 0;color:#8c3c3c">3. Plazos, Excepciones y Trampas del Tribunal</h4>
          <ul style="margin:0;padding-left:20px;font-size:13px;line-height:1.7;color:#443d39">
            ${trapQuestions.map(q => `<li>${q}</li>`).join('')}
          </ul>
        </div>
      </div>
    `;
  }

  function matchTopicForFile(filename) {
    const normName = norm(filename);
    const o = opp();
    
    // 1. Check for explicit "Bloque X Tema Y" e.g. "Bloque 1 Tema 4" or "B1 T4"
    const mBlockTopic = normName.match(/(?:bloque|b)[\s_-]*([1-6]|i{1,3}|iv|v|vi)[\s._-]*(?:tema|t)[\s._-]*(\d+)/i);
    if (mBlockTopic) {
      const romanMap = { i: 0, ii: 1, iii: 2, iv: 3, v: 4, vi: 5 };
      const bRaw = mBlockTopic[1].toLowerCase();
      const bIdx = romanMap[bRaw] !== undefined ? romanMap[bRaw] : (parseInt(bRaw, 10) - 1);
      const tNumInBlock = parseInt(mBlockTopic[2], 10);
      const blockTopics = o.topics.filter(t => t.b === bIdx);
      if (blockTopics[tNumInBlock - 1]) return blockTopics[tNumInBlock - 1];
    }

    // 2. Check for explicit "Tema X" or "Tema 04" or "T4"
    const mTopic = normName.match(/(?:tema|t|leccion|capitulo)[\s._-]*(\d+)/i);
    if (mTopic) {
      const num = parseInt(mTopic[1], 10);
      const byId = o.topics.find(t => t.id === 't' + num);
      if (byId) return byId;
      if (num > 0 && num <= o.topics.length) return o.topics[num - 1];
    }

    // 3. Keyword / Concept matching with highest overlap against topic titles
    let bestTopic = null;
    let bestScore = 0;
    for (const t of o.topics) {
      const tNorm = norm(t.title);
      const words = tNorm.split(/[\s,.:;()\/]+/).filter(w => w.length > 3 && !['para','como','este','esta','sobre','entre','del','las','los'].includes(w));
      let score = 0;
      for (const w of words) {
        if (normName.includes(w)) score += w.length;
      }
      if (score > bestScore) {
        bestScore = score;
        bestTopic = t;
      }
    }
    if (bestTopic && bestScore >= 4) return bestTopic;

    // 4. Fallback based on block mentions (e.g. "Bloque 1", "Bloque I")
    const mBlockOnly = normName.match(/(?:bloque|b)[\s_-]*([1-6]|i{1,3}|iv|v|vi)\b/i);
    if (mBlockOnly) {
      const romanMap = { i: 0, ii: 1, iii: 2, iv: 3, v: 4, vi: 5 };
      const bRaw = mBlockOnly[1].toLowerCase();
      const bIdx = romanMap[bRaw] !== undefined ? romanMap[bRaw] : (parseInt(bRaw, 10) - 1);
      const blockTopics = o.topics.filter(t => t.b === bIdx);
      if (blockTopics.length) return blockTopics[0];
    }

    return currentTopic() || o.topics[0];
  }

          o.group=String(fd.get('group'));
          o.short=String(fd.get('short')||'').trim()||o.group;
          state.opps.push(o);
          state.active=o.id;
          resetContext();
          save();
          closeModal();
          go('library');
          toast('¡Oposición «'+o.name+'» lista con '+o.topics.length+' temas oficiales!');
          petReact(true);
          break;
        }
        case 'gemini-skills-form':{
          state.geminiSkills = {
            summary: String(fd.get('summary') || '').trim(),
            scheme: String(fd.get('scheme') || '').trim(),
            tables: String(fd.get('tables') || '').trim()
          };
          save();
          closeModal();
          renderRoute(false);
          toast('¡Habilidades y Prompts de Gemini guardados y aplicados!');
          petReact(true);
          break;
        }
        case 'topic-form':{
          const b=String(fd.get('block')).trim(),name=String(fd.get('title')).trim();if(!b||!name)throw Error('Completa el título y el bloque.');const o=opp();if(!o.blocks.includes(b))o.blocks.push(b);const t={id:uid(),title:name,b:o.blocks.indexOf(b),text:String(fd.get('text')||'').trim(),source:'',rounds:0,errors:0,assets:[],updated:Date.now()};o.topics.push(t);remember(t);go('reader',t.id);toast('Tema añadido a tu cuaderno.');break
        }
        case 'paste-syllabus-form': {
          const text = String(fd.get('syllabusText') || '').trim();
          const oppName = String(fd.get('name') || 'Mi Oposición').trim();
          if (!text) throw Error('Pega el texto del temario antes de guardar.');
          const parsed = parseSyllabus(text);
          if (!parsed.topics || !parsed.topics.length) throw Error('No se detectaron temas en el texto. Asegúrate de incluir líneas tipo «Tema 1...».');
          const newOppObj = {
            id: uid(),
            name: oppName,
            short: oppName.slice(0, 15),
            group: 'A2',
            blocks: parsed.blocks.length ? parsed.blocks : ['Temario General'],
            topics: parsed.topics,
            baseURL: '',
            basePdf: '',
            template: false,
            questions: [],
            cards: [],
            lastTopic: parsed.topics[0]?.id || ''
          };
          state.opps.push(newOppObj);
          state.active = newOppObj.id;
          resetContext();
          save();
          closeModal();
          go('library');
          toast(`¡Oposición «${oppName}» creada con ${parsed.topics.length} temas!`);
          petReact(true);
          break;
        }
      case 'import-form':await doImport(form);break;
        case 'edit-topic-form':{const t=topic(form.dataset.id);if(!t)throw Error('No se encuentra el tema.');const title=String(fd.get('title')).trim();if(!title)throw Error('El título no puede estar vacío.');t.title=title;t.text=String(fd.get('text')||'').trim();t.b=Number(fd.get('block'));t.source=safeURL(fd.get('source'));t.updated=Date.now();remember(t);closeModal();renderRoute(false);toast('Cambios guardados.');break}
        case 'goal-form':state.goal=Number(fd.get('goal'));save();closeModal();renderRoute(false);toast('Objetivo actualizado: '+humanMins(state.goal*7)+' semanales.');break;
        case 'settings-form':state.name=String(fd.get('name')).trim()||'Opositor';state.goal=Number(fd.get('goal'));save();closeModal();renderRoute(false);toast('Preferencias guardadas.');break;
        case 'bases-form':{const f=fd.get('file'),o=opp(),url=String(fd.get('url')||'').trim();if(url&&!safeURL(url))throw Error('El enlace debe comenzar por https:// o http://.');if(f?.size){if(!/\.pdf$/i.test(f.name)||f.size>30*1024*1024)throw Error('Selecciona un PDF de hasta 30 MB.');const key=uid();await fileStore('put',key,f);o.basePdf=key}else if(fd.get('remove'))o.basePdf='';o.baseURL=safeURL(url);save();closeModal();toast('Bases de la oposición actualizadas.');break}
        case 'boe-form':await searchBulletin(form);break;
        case 'test-form':prepareTest(form);break;
        case 'ai-settings-form':apiKey=String(fd.get('key')||'').trim()||apiKey;state.model=String(fd.get('model')).trim();save();closeModal();toast('Configuración de IA guardada.');break;
        case 'ai-generate-form':await generateAI(form);break;
        case 'card-form':{const c={id:uid(),t:fd.get('topic')||'',front:String(fd.get('front')).trim(),back:String(fd.get('back')).trim(),why:'',ref:'Tarjeta personal',url:''};if(!c.front||!c.back)throw Error('Completa los dos lados de la tarjeta.');(opp().cards||=[]).push(c);flashCurrent=c.id;flashTopic='';flashFlipped=false;save();go('flash');toast('Tarjeta añadida a tu mazo.');break}
        case 'pet-form':petDraft.name=String(fd.get('name')).trim()||'OpoPet';petDraft.personality=String(fd.get('personality'));petDraft.prompt=String(fd.get('prompt')).trim();state.pet={...petDraft};save();closeModal();renderRoute(false);toast('Tu compañero está listo.');break;
        case 'rosco-form':roscoAnswer(String(fd.get('answer')||''));break;
        case 'restore-form':await restoreCopy(form);break;
      }
    }catch(err){if(err.name!=='AbortError'){const msg=err.message||'No se pudo completar la operación.';if($('#modal').open&&$('#modal').contains(form))modalError(msg);else toast(msg)}}finally{delete form.dataset.busy;if(submit&&submit.isConnected)submit.disabled=false}
  });
  document.addEventListener('pointerdown',e=>{const cell=e.target.closest('.word-cell');if(cell&&activeGame?.type==='sopa'&&!activeGame.done)wordDrag={start:+cell.dataset.id,end:+cell.dataset.id,moved:false}});
  document.addEventListener('pointermove',e=>{if(!wordDrag||!activeGame||activeGame.type!=='sopa')return;const cell=document.elementFromPoint(e.clientX,e.clientY)?.closest('.word-cell');if(!cell)return;const end=+cell.dataset.id;if(end===wordDrag.end)return;wordDrag.end=end;wordDrag.moved=wordDrag.start!==end;const line=new Set(wordLine(wordDrag.start,end));$$('.word-cell').forEach(n=>n.classList.toggle('selected',line.has(+n.dataset.id)))});
  document.addEventListener('pointerup',()=>{if(wordDrag?.moved&&activeGame?.type==='sopa'){activeGame.suppressClick=Date.now()+350;selectWord(wordDrag.start,wordDrag.end)}wordDrag=null});
  document.addEventListener('pointercancel',()=>{wordDrag=null});
  document.addEventListener('keydown',e=>{if(e.key==='Escape')closeMenus()});
  window.addEventListener('hashchange',()=>{closeModal();renderRoute()});
  async function diagnostics(){
    modal('Comprobación del escritorio','<p>Pruebas locales sin enviar datos ni modificar tu progreso.</p><div id="audit-results"></div><div class="small muted" id="audit-summary" aria-live="polite"><span class="loading"></span> Comprobando...</div>');
    const report=$('#audit-results'),rows=[];
    const check=async(name,fn)=>{try{if(!await fn())throw Error('Resultado inesperado.');rows.push(true);report.insertAdjacentHTML('beforeend',`<div class="audit-row"><span>${I('check',12)}</span><b>${esc(name)}</b></div>`)}catch(e){rows.push(false);report.insertAdjacentHTML('beforeend',`<div class="audit-row failed"><span>${I('x',12)}</span><div><b>${esc(name)}</b><small>${esc(e.message)}</small></div></div>`)}};
    const sample={title:'Prueba de exportación',text:noteProcedure,source:'https://www.boe.es/buscar/act.php?id=BOE-A-2015-10565'};
    await check('Plantilla: 58 temas en 6 bloques',()=>{const o=makeTemplate();return o.topics.length===58&&o.blocks.length===6&&new Set(o.topics.map(t=>t.id)).size===58});
    await check('Importación de índices TXT y JSON',()=>parseSyllabus('# Bloque A\nTema 1\n# Bloque B\nTema 2').blocks.length===2&&parseSyllabus('[{"titulo":"Un tema","bloque":"Personal"}]').topics.length===1);
    await check('Síntesis inferior al 30% del original',()=>[noteProcedure,...bank.map(q=>q.why)].every(s=>words(summarize(s).join(' ')).length<=words(s).length*.3));
    await check('Cuatro opciones y reparto A/B/C/D equilibrado',()=>[10,15,20,30].every(n=>{const qs=balancedQuestions(bank.slice(0,n)),counts=[0,0,0,0];qs.forEach(q=>counts[q.c]++);return Math.max(...counts)-Math.min(...counts)<=1&&qs.every((q,i)=>q.a.length===4&&q.a[q.c]===bank[i].a[bank[i].c])}));
    await check('Casos prácticos con referencias oficiales',()=>caseLibrary.every(c=>c.ids.length>=5&&c.ids.length<=10&&c.ids.every(i=>officialURL(bank[i-1]?.url))));
    await check('PDF: páginas, tablas y referencias internas',async()=>{for(const cols of [1,2])for(const tab of ['outline','table']){const text=await pdfBlob(sample,cols,tab).text(),xref=Number(text.match(/startxref\n(\d+)/)?.[1]);if(!text.startsWith('%PDF-1.4')||!text.endsWith('%%EOF')||text.slice(xref,xref+4)!=='xref')return false;const entries=[...text.matchAll(/^(\d{10}) 00000 n /gm)];if(!entries.length||!entries.every((m,i)=>text.slice(+m[1]).startsWith((i+1)+' 0 obj')))return false}return true});
    await check('Word: paquete DOCX y XML válidos',async()=>{const ab=await docxBlob(sample,'table').arrayBuffer(),dv=new DataView(ab),decoder=new TextDecoder(),names=[];let p=0;while(p+30<ab.byteLength&&dv.getUint32(p,true)===0x04034b50){const size=dv.getUint32(p+18,true),nl=dv.getUint16(p+26,true),xl=dv.getUint16(p+28,true),start=p+30+nl+xl;names.push(decoder.decode(ab.slice(p+30,p+30+nl)));const xml=new DOMParser().parseFromString(decoder.decode(ab.slice(start,start+size)),'application/xml');if(xml.querySelector('parsererror'))return false;p=start+size}return names.includes('word/document.xml')&&names.includes('[Content_Types].xml')&&names.includes('_rels/.rels')&&dv.getUint32(ab.byteLength-22,true)===0x06054b50});
    await check('Rosco completo y tablero de palabras resoluble',()=>{const rosco=roscoData(),s=makeWordGrid();return rosco.length===27&&rosco.every(q=>wordKey(q.term).includes(q.letter))&&s.placements.length===6&&s.placements.every(p=>p.cells.map(i=>s.grid[i]).join('')===p.word)});
    await check('Lectura y escritura en IndexedDB',async()=>{const k='@audit-'+uid();try{await fileStore('put',k,new Blob(['Mi Cuaderno']));return (await (await fileStore('get',k)).text())==='Mi Cuaderno'}finally{await fileStore('remove',k)}});
    await check('Preferencias persistentes en localStorage',()=>{const k=STORAGE+'.audit';try{localStorage.setItem(k,'ok');return localStorage.getItem(k)==='ok'}finally{localStorage.removeItem(k)}});
    const summary=$('#audit-summary');if(summary){summary.className='notice '+(rows.every(Boolean)?'success':'error');summary.style.marginTop='14px';summary.textContent=rows.filter(Boolean).length+' de '+rows.length+' comprobaciones correctas. Las APIs externas no se prueban con tus datos.'}
  }
  async function boot(){
    try{const s=JSON.parse(localStorage.getItem(STORAGE));if(s?.large){const large=await fileStore('get','@workspace');if(large?.version===1&&large.opps?.length)state=large}else if(!s)save()}catch{}
    $('#close-icon').innerHTML=I('x',18);$('#footer-brand').innerHTML=I('book',13)+' Mi Cuaderno de Oposiciones <span>·</span> Ultimate Edition';
    renderRoute();setInterval(updateClock,1000);
  }
  boot();
  </script>
